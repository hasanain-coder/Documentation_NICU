<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Dose Calculator | Baghdad Teaching Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0F4F3; --fg: #1C2526; --muted: #5A6872; --accent: #0F766E;
            --accent-light: #14B8A6; --card: #FFFFFF; --border: #D1DEDD;
            --danger: #B91C1C; --surface: #E8EFEE;
        }
        * { font-family: 'Inter', 'Cairo', 'Noto Sans Arabic', sans-serif; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, .display-font { font-family: 'Crimson Pro', serif; }
        body { background: var(--bg); background-image: radial-gradient(ellipse at 0% 0%, rgba(15, 118, 110, 0.06) 0%, transparent 50%), radial-gradient(ellipse at 100% 100%, rgba(20, 184, 166, 0.04) 0%, transparent 50%); }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); transition: all 0.25s ease; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25); }
        .arabic-text { font-family: 'Cairo', 'Noto Sans Arabic', sans-serif; direction: rtl; text-align: right; unicode-bidi: isolate; }
        .pdf-page { width: 210mm; height: 297mm; padding: 8mm; background: white; box-sizing: border-box; page-break-after: always; }
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3mm; height: 100%; }
        .pdf-cell { border: 2px solid #000; border-radius: 2mm; padding: 3mm; display: flex; flex-direction: column; position: relative; }
        #pdf-render-container { position: absolute; top: 0; left: 0; z-index: -1000; opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-[var(--border)] shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[var(--accent-light)] flex items-center justify-center shadow-md">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-[var(--fg)]">NICU Dose Calculator</h1>
                    <p class="text-xs text-[var(--muted)]">Baghdad Teaching Hospital</p>
                </div>
            </div>
            <div id="patientCounter" class="hidden px-4 py-2 rounded-full bg-[var(--accent)]/10 border border-[var(--accent)]/20">
                <span class="text-[var(--accent)] font-semibold text-sm" id="counterText">0 Patients</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-white rounded-2xl shadow-lg border border-[var(--border)] overflow-hidden">
            <div class="bg-gradient-to-r from-[var(--accent)] to-[var(--accent-light)] px-6 py-4">
                <h2 class="text-xl text-white font-semibold">Patient Information</h2>
            </div>
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Patient Name</label>
                        <input type="text" id="inputName" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]" placeholder="Full name">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Weight (kg)</label>
                        <input type="text" id="inputWeight" inputmode="decimal" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]" placeholder="e.g., 2.35">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Postnatal Age (Days)</label>
                        <select id="inputAge" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Gestational Age (weeks)</label>
                        <input type="text" id="inputGA" inputmode="decimal" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]" placeholder="e.g., 34">
                    </div>
                </div>

                <div class="border-t border-[var(--border)] pt-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4 mb-4 items-start">
                        <div class="lg:col-span-1 space-y-2">
                            <label class="block text-sm font-semibold">Category</label>
                            <select id="selectCategory" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]"></select>
                        </div>
                        <div class="lg:col-span-1 space-y-2">
                            <label class="block text-sm font-semibold">Drug</label>
                            <select id="selectDrug" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]"></select>
                            <input type="text" id="inputCustomDrug" class="hidden w-full px-4 py-3 rounded-xl border mt-2 border-[var(--border)]" placeholder="Drug Name">
                        </div>
                        <div class="lg:col-span-2 space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <div id="dosePerKgContainer" class="hidden">
                                    <label class="block text-sm font-semibold text-[var(--accent)]">Dose/kg</label>
                                    <input type="text" id="inputDosePerKg" class="w-full px-3 py-3 rounded-xl border border-[var(--accent)]/30 font-bold">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold" id="labelTotalDose">Total Dose</label>
                                    <div class="flex gap-1">
                                        <input type="text" id="inputDose" class="flex-1 px-3 py-3 rounded-xl border border-[var(--border)]" placeholder="Auto">
                                        <input type="text" id="inputCustomUnit" class="hidden w-16 px-1 py-3 rounded-xl border border-[var(--border)]" placeholder="Unit">
                                    </div>
                                </div>
                            </div>
                            <input type="text" id="inputCustomMethod" class="hidden w-full px-4 py-3 rounded-xl border border-[var(--border)]" placeholder="Method (optional)">
                        </div>
                        <div class="lg:col-span-1 space-y-2" id="freqContainer">
                            <label class="block text-sm font-semibold">Frequency</label>
                            <select id="inputFreq" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-[var(--surface)]">
                                <option value="1">Once (x 1)</option>
                                <option value="2">Twice (x 2)</option>
                                <option value="3">Three (x 3)</option>
                                <option value="4">Four (x 4)</option>
                                <option value="q36hr">q36hr</option>
                                <option value="q48hr">q48hr</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 space-y-2 hidden" id="targetVolContainer">
                            <label class="block text-sm font-semibold text-[var(--accent)]">Target Vol</label>
                            <select id="inputTargetVol" class="w-full px-4 py-3 rounded-xl border border-[var(--border)]">
                                <option value="10">10 ml (x2)</option>
                                <option value="5">5 ml (x3)</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 flex flex-col gap-2">
                            <div id="addonContainer" class="hidden grid grid-cols-2 gap-2">
                                <input type="text" id="inputAddonVol" class="w-full px-2 py-2 rounded-lg border text-xs" placeholder="ml">
                                <input type="text" id="inputAddonType" class="w-full px-2 py-2 rounded-lg border text-xs" placeholder="KCL">
                            </div>
                            <button id="btnAddDrug" class="btn-primary w-full py-3 rounded-xl text-white font-semibold h-[50px]">Add</button>
                        </div>
                    </div>

                    <div id="methodPreviewContainer" class="hidden bg-[var(--surface)] border border-[var(--accent)]/20 rounded-xl p-4 mb-4">
                        <p class="text-xs font-semibold text-[var(--accent)] uppercase mb-1">Method of Administration</p>
                        <p id="previewMethod" class="text-[var(--fg)] text-sm font-bold" style="direction: ltr;">-</p>
                        <p id="warningMessage" class="hidden text-sm text-[var(--danger)] font-bold mt-2 arabic-text"></p>
                    </div>

                    <div id="dopamineTableContainer" class="hidden mt-6 overflow-x-auto">
                        <table class="w-full text-sm border border-[var(--border)]">
                            <thead class="bg-[var(--accent)] text-white"><tr><th class="p-2">Rate (ml/24hr)</th><th class="p-2">Dose (mcg/kg/min)</th></tr></thead>
                            <tbody id="dopamineTableBody" class="bg-white"></tbody>
                        </table>
                    </div>
                </div>

                <div id="drugsList" class="mt-4 space-y-2"></div>
                <button id="btnSavePatient" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-6">Save Patient to Queue</button>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-[var(--fg)]">Patient Queue</h2>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="selectAllCheckbox" class="w-5 h-5 rounded text-[var(--accent)]">
                    <span class="text-sm font-medium">Select All</span>
                </label>
            </div>
            <div class="flex gap-2">
                <button id="btnPdf" disabled class="btn-primary px-5 py-2.5 rounded-xl text-white font-medium">Generate PDF</button>
                <button id="btnClearAll" class="px-5 py-2.5 rounded-xl border border-[var(--danger)]/30 text-[var(--danger)]">Clear All</button>
            </div>
            <div id="patientQueue" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            <div id="emptyState" class="text-center py-20 bg-white rounded-2xl border-2 border-dashed border-[var(--border)]">
                <p class="text-[var(--muted)] text-lg">No patients in queue</p>
            </div>
        </section>
    </main>

    <div id="pdf-render-container"></div>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 opacity-0 transition-all pointer-events-none">
        <span id="toastMsg"></span>
    </div>

    <script>
        /** * ==========================================
         * NICU MEDICAL DATABASE (Structured Data)
         * ==========================================
         */
        const NICU_DATABASE = {
            METHODS: {
                1: '** / 5min',
                2: '** + 5 ml GW / 10 min',
                3: '** + ## ml GW >> ^^ ml /30 min',
                4: '** + 3 ml GW / 3 min',
                5: '** / 60 min',
                6: 'over 24 hr',
                7: 'Special Nutrients',
                8: '** <span class="arabic-text" style="display:inline-block; direction:rtl;">مع المغذي</span>',
                9: 'كل اثنين وخميس',
                10: '** + ## ml GW >> ^^ ml /24 hr',
                11: '** + 3ml NS / 15 min <span class="arabic-text" style="display:inline-block; direction:rtl;">تبخير</span>',
                12: 'تحل الكبسولة ب ٢ سي سي كلوكوز وتر ثم يدفع عن طريق ال OG ثم يدفع ٢ سي سي كلوكوز وتر عن طريق ال OG',
                13: 'بالفم',
                14: '3ml NS / 15 min <span class="arabic-text" style="display:inline-block; direction:rtl;">تبخير</span>'
            },
            CATEGORIES: [
                { name: 'Antibiotics', ids: [1, 2, 5, 6, 7, 8, 11, 16, 24] },
                { name: 'Sedatives & Inotropes', ids: [9, 17, 18, 19, 20, 22, 23, 26, 27] },
                { name: 'Miscellaneous', ids: [3, 4, 10, 25, 28, 30] },
                { name: 'Fluids', ids: [12, 13, 14, 15] },
                { name: 'Oral capsules', ids: [21, 29, 31] },
                { name: 'Nebulization', ids: [32, 33, 34] },
                { name: 'Other+', ids: ['other'] }
            ],
            DRUGS: [
                { id: 1, name: 'Amoxicillin', dosePerKg: 50, unit: 'mg', factor: 50, methodIndex: 1, 
                    getFreq: (ga, pna) => (ga < 100 && pna < 8) ? '2' : '3' 
                },
                { id: 16, name: 'Amikacin', dosePerKg: 15, unit: 'mg', factor: 8, methodIndex: 2, defaultFreq: 1 },
                { id: 2, name: 'Gentamicin', dosePerKg: 5, unit: 'mg', factor: 40, methodIndex: 2, 
                    getFreq: (ga, pna) => {
                        if (ga <= 29) return (pna <= 14) ? 'q48hr' : 'q36hr';
                        if (ga <= 34) return 'q36hr';
                        return '1';
                    }
                },
                { id: 3, name: 'Caffeine Loading', dosePerKg: 20, unit: 'mg', factor: 20, methodIndex: 3, defaultFreq: 1 },
                { id: 4, name: 'Caffeine Maint.', dosePerKg: 10, unit: 'mg', factor: 20, methodIndex: 2, defaultFreq: 1 },
                { id: 5, name: 'Colistin Loading', dosePerKg: 150000, unit: 'IU', factor: 500000, methodIndex: 2, defaultFreq: 1 },
                { id: 6, name: 'Colistin Maint.', dosePerKg: 37500, unit: 'IU', factor: 500000, methodIndex: 2, defaultFreq: 2 },
                { id: 24, name: 'Colistin neb.', dosePerKg: 5, unit: 'mg', factor: 16.667, methodIndex: 11, defaultFreq: 2, alert: 'مهم: يعطى فنتلوين تبخير قبله ب١٠ دقائق' },
                { id: 8, name: 'Meropenem', dosePerKg: 40, unit: 'mg', factor: 50, methodIndex: 3,
                    getFreq: (ga, pna) => (ga < 32 && pna < 14) ? '2' : '3'
                },
                { id: 11, name: 'Vancomycin', dosePerKg: 15, unit: 'mg', factor: 2, methodIndex: 5,
                    getFreq: (ga, pna, w) => {
                        if (pna < 7) {
                            if (w < 1.2) return '1';
                            if (w <= 2) return '2';
                            return '3';
                        }
                        return (w < 1.2) ? '1' : '3';
                    }
                },
                { id: 9, name: 'Dopamine syringe pump', isDopamine: true, defaultFreq: 1 },
                { id: 22, name: 'Dopamine + fluid', dosePerKg: 5, unit: 'mg', factor: 40, methodIndex: 8, isDopamine: true },
                { id: 23, name: 'Dopamine Y-site', dosePerKg: 5, unit: 'mg', factor: 40, methodIndex: 10, isDopamine: true },
                { id: 17, name: 'Dexmedetomidine + fluid', dosePerKg: 0.3, unit: 'mcg', factor: 100, methodIndex: 8 },
                { id: 18, name: 'Dexmedetomidine Y-site', dosePerKg: 0.3, unit: 'mcg', factor: 100, methodIndex: 10 },
                { id: 19, name: 'Midazolam + fluid', dosePerKg: 0.03, unit: 'mg', factor: 5, methodIndex: 8 },
                { id: 20, name: 'Midazolam Y-site', dosePerKg: 0.03, unit: 'mg', factor: 5, methodIndex: 10 },
                { id: 26, name: 'Phenobarbital loading', dosePerKg: 20, unit: 'mg', factor: 10, methodIndex: 3, alert: 'مهم: تخفف الامبولة الى ٢٠ مل مع NS' },
                { id: 27, name: 'Phenobarbital Maint.', dosePerKg: 2.5, unit: 'mg', factor: 10, methodIndex: 3, defaultFreq: 2 },
                { id: 21, name: 'Fluconazol prophylactic', dosePerKg: 4, unit: 'mg', methodIndex: 9, defaultFreq: 1 },
                { id: 12, name: 'TPN', methodIndex: 6, hideDetails: true },
                { id: 13, name: '1/5 GS', methodIndex: 7, isNutrient: true, prep: (vol) => `(5% GW ${(vol*0.8).toFixed(0)} ml + ${(vol*0.2).toFixed(0)} ml NS)` },
                { id: 14, name: '10% GW', methodIndex: 7, isNutrient: true, prep: (vol) => `(5% GW ${(vol*0.9).toFixed(0)} ml + ${(vol*0.1).toFixed(0)} ml HT)` },
                { id: 15, name: '5% GW', methodIndex: 7, isNutrient: true, noPrep: true },
                { id: 30, name: 'Vit D drop', dosePerKg: 400, unit: 'IU', factor: 1, methodIndex: 13 },
                { id: 10, name: 'Vit k', dosePerKg: 1, unit: 'mg', factor: 10, methodIndex: 4 },
                { id: 32, name: 'Ventolin neb.', dosePerKg: 1.25, unit: 'mg', factor: 5, methodIndex: 11, defaultFreq: 4 },
                { id: 33, name: 'NS neb.', dosePerKg: 3, unit: 'ml', methodIndex: 14, defaultFreq: 4 },
                { id: 34, name: 'Pulmicort neb.', dosePerKg: 0.25, unit: 'mg', factor: 0.5, methodIndex: 11, defaultFreq: 2 },
                { id: 25, name: 'Decadron DART', dosePerKg: 0.075, unit: 'mg', factor: 0.4, methodIndex: 2, defaultFreq: 2, alert: 'مهم: تخفف الى ٢٠ مل' },
                { id: 28, name: 'Decadron amp', dosePerKg: 0.25, unit: 'mg', factor: 0.4, methodIndex: 2, defaultFreq: 2 },
                { id: 29, name: 'Sildenafil cap', dosePerKg: 1, unit: 'mg', methodIndex: 12, defaultFreq: 3 },
                { id: 31, name: 'HydroCHLOROthiazide cap', dosePerKg: 1, unit: 'mg', methodIndex: 12, defaultFreq: 2 }
            ]
        };

        /** * ==========================================
         * APPLICATION CORE LOGIC
         * ==========================================
         */
        const STORAGE_KEY = 'nicu_patient_queue';
        let patients = [], currentDrugs = [], selectedPatientIds = new Set();
        const $ = id => document.getElementById(id);

        const utils = {
            cleanNum: (s) => {
                if (!s) return 0;
                let c = s.toString().replace(/[،,٫]/g, '.').replace(/[^0-9.]/g, '');
                return parseFloat(c) || 0;
            },
            bold: (t) => t ? t.toString().replace(/\d+(\.\d+)?/g, '<strong style="font-weight: 900;">$&</strong>') : '',
            toast: (m, type='success') => {
                const t = $('toast'); $('toastMsg').textContent = m;
                t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 transition-all ${type==='error'?'bg-red-700':'bg-teal-800'} text-white opacity-100 translate-y-0`;
                setTimeout(() => t.style.opacity = '0', 3000);
            }
        };

        // UI Initialization
        const init = () => {
            const ageOpts = Array.from({length: 30}, (_, i) => `<option value="${i+1}">Day ${i+1}</option>`).join('');
            $('inputAge').innerHTML = '<option value="">Select day</option>' + ageOpts + '<option value="31">> 30 days</option>';
            $('selectCategory').innerHTML = '<option value="">-- Category --</option>' + NICU_DATABASE.CATEGORIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            loadData();
        };

        const getMethodString = (drug, dose) => {
            if (drug.isDopamine && drug.id === 9) return '1 ml dopamin + 39 ml GW';
            
            // Nutrient Preparation Logic
            if (drug.isNutrient) {
                if (drug.noPrep) return " ";
                const vol = dose, av = utils.cleanNum($('inputAddonVol').value), at = $('inputAddonType').value || 'Add-on';
                let main = `${vol} ml` + (av > 0 ? ` (+ ${av} ml ${at})` : "");
                let calcV = vol, calcA = av, suffix = "";
                if ((vol + av) > 160) { calcV /= 2; calcA /= 2; suffix = " X2"; }
                let prepText = drug.prep ? drug.prep(calcV) : `(${drug.name} ${calcV} ml)`;
                if (av > 0) prepText = prepText.replace(')', ` + ${calcA.toFixed(0)} ml ${at})`);
                return `${main} | ${prepText}${suffix}`;
            }

            let m = NICU_DATABASE.METHODS[drug.methodIndex] || '-';
            let ml = dose / drug.factor;
            if (drug.methodIndex === 3 || drug.methodIndex === 10) {
                const target = parseInt($('inputTargetVol').value);
                const mult = (target === 10) ? 2 : 3;
                ml *= mult;
                m = m.replace('^^', target).replace('##', (target * 2 - ml).toFixed(0));
            } else {
                m = m.replace('##', (20 - ml).toFixed(0));
            }

            let disp = ml < 1 ? (ml * 100).toFixed(0) + ' units' : ml.toFixed(1) + ' ml';
            return m.replace('**', disp);
        };

        const updatePreview = () => {
            const drugId = $('selectDrug').value;
            if (!drugId || drugId === 'other') return;
            const drug = NICU_DATABASE.DRUGS.find(d => d.id == drugId);
            const w = utils.cleanNum($('inputWeight').value), ga = utils.cleanNum($('inputGA').value), pna = parseInt($('inputAge').value) || 0;
            
            if (drug.isDopamine && drug.id === 9) {
                $('dopamineTableContainer').classList.remove('hidden');
                $('methodPreviewContainer').classList.add('hidden');
                renderDopTable(w);
                return;
            }

            $('dopamineTableContainer').classList.add('hidden');
            $('methodPreviewContainer').classList.remove('hidden');
            
            // Automatic Dose Calculation
            if (drug.getFreq) $('inputFreq').value = drug.getFreq(ga, pna, w);
            if (w > 0 && drug.dosePerKg && !$('inputDose').value) {
                $('inputDose').value = (w * drug.dosePerKg).toFixed(drug.dosePerKg < 1 ? 2 : 1);
            }
            
            $('previewMethod').innerHTML = getMethodString(drug, utils.cleanNum($('inputDose').value));
        };

        const renderDopTable = (w) => {
            $('dopamineTableBody').innerHTML = [2, 5, 7, 10].map(d => `<tr><td class="p-2 text-center font-bold text-teal-800">${((d*w*1440)/1000).toFixed(0)} ml</td><td class="p-2 text-center">${d}</td></tr>`).join('');
        };

        // Storage & Queue Management
        const loadData = () => { try { const d = localStorage.getItem(STORAGE_KEY); if(d){ patients = JSON.parse(d); renderQueue(); } } catch(e){} };
        const saveData = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));

        const renderQueue = () => {
            $('patientQueue').innerHTML = patients.map(p => `
                <div class="bg-white rounded-2xl border p-4 shadow-sm">
                    <div class="flex justify-between border-b pb-2 mb-3">
                        <input type="checkbox" ${selectedPatientIds.has(p.id)?'checked':''} onclick="toggleSel('${p.id}')" class="w-5 h-5">
                        <div class="text-right"><h3 class="font-bold">${p.name}</h3><p class="text-xs text-gray-500">${p.weight}kg | Day ${p.age}</p></div>
                        <button onclick="deletePat('${p.id}')" class="text-red-600">×</button>
                    </div>
                    ${p.drugs.map(d => `<div class="text-sm border-b border-dashed py-2">
                        <div class="flex justify-between font-bold"><span>${d.name}</span><span>${d.dose}${d.unit} ${d.freq}</span></div>
                        <p class="text-xs text-gray-600" style="direction:ltr;">${utils.bold(d.method)}</p>
                    </div>`).join('')}
                </div>`).join('');
            updateMeta();
        };

        const updateMeta = () => {
            $('counterText').textContent = `${patients.length} Patients`;
            $('patientCounter').classList.toggle('hidden', patients.length === 0);
            $('btnPdf').disabled = patients.length === 0;
            $('emptyState').classList.toggle('hidden', patients.length > 0);
        };

        // Events
        $('selectCategory').onchange = (e) => {
            const cat = NICU_DATABASE.CATEGORIES.find(c => c.name === e.target.value);
            $('selectDrug').innerHTML = '<option value="">-- Drug --</option>' + (cat?.ids.map(id => {
                const d = id === 'other' ? {id:'other', name:'Other+'} : NICU_DATABASE.DRUGS.find(x => x.id === id);
                return `<option value="${d.id}">${d.name}</option>`;
            }).join('') || '');
            updatePreview();
        };

        $('selectDrug').onchange = () => {
            const isOther = $('selectDrug').value === 'other';
            $('inputCustomDrug').classList.toggle('hidden', !isOther);
            $('inputCustomMethod').classList.toggle('hidden', !isOther);
            $('targetVolContainer').classList.toggle('hidden', !['3','10'].includes(NICU_DATABASE.DRUGS.find(d => d.id == $('selectDrug').value)?.methodIndex?.toString()));
            updatePreview();
        };

        $('btnAddDrug').onclick = () => {
            const dId = $('selectDrug').value, w = utils.cleanNum($('inputWeight').value);
            if(!dId || !w) return utils.toast('Missing Info', 'error');
            const drug = dId === 'other' ? { name: $('inputCustomDrug').value, unit: $('inputCustomUnit').value, method: $('inputCustomMethod').value } : NICU_DATABASE.DRUGS.find(d => d.id == dId);
            currentDrugs.push({
                name: drug.name,
                dose: $('inputDose').value,
                unit: drug.unit || '',
                freq: $('inputFreq').value,
                method: dId === 'other' ? drug.method : getMethodString(drug, utils.cleanNum($('inputDose').value)),
                isNutrient: drug.isNutrient,
                drugId: dId
            });
            renderDrugs();
            $('inputDose').value = '';
        };

        const renderDrugs = () => {
            $('drugsList').innerHTML = currentDrugs.map((d, i) => `<div class="bg-gray-100 p-3 rounded-xl flex justify-between"><span>${d.name} - ${d.dose}${d.unit}</span><button onclick="currentDrugs.splice(${i},1);renderDrugs()">×</button></div>`).join('');
        };

        $('btnSavePatient').onclick = () => {
            if(!currentDrugs.length) return;
            patients.push({ id: Date.now().toString(), name: $('inputName').value, weight: $('inputWeight').value, age: $('inputAge').value, drugs: [...currentDrugs] });
            currentDrugs = []; renderDrugs(); renderQueue(); saveData();
            $('inputName').value = ''; $('inputWeight').value = '';
        };

        window.deletePat = id => { patients = patients.filter(p => p.id !== id); saveData(); renderQueue(); };
        window.toggleSel = id => { selectedPatientIds.has(id) ? selectedPatientIds.delete(id) : selectedPatientIds.add(id); };

        $('btnPdf').onclick = async () => {
            const sel = patients.filter(p => selectedPatientIds.has(p.id));
            if(!sel.length) return;
            utils.toast('Generating PDF...', 'info');
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            const container = $('pdf-render-container'); container.innerHTML = '';
            
            for (let p of sel) {
                const el = document.createElement('div'); el.className = 'pdf-page';
                el.innerHTML = `<div class="border-4 border-black p-4 h-full"><h2 class="text-2xl font-black text-right">${p.name} (${p.weight}kg)</h2>
                <div class="mt-4">${p.drugs.map(d => `<div class="border-b-2 border-black py-2"><div class="flex justify-between font-bold"><span>${d.name}</span><span>${d.dose}${d.unit} ${d.freq}</span></div><p style="direction:ltr">${d.method}</p></div>`).join('')}</div></div>`;
                container.appendChild(el);
                const canvas = await html2canvas(el, {scale:2});
                doc.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 0, 0, 210, 297);
                if(sel.indexOf(p) < sel.length - 1) doc.addPage();
                container.innerHTML = '';
            }
            doc.save('NICU_Report.pdf');
        };

        init();
    </script>
</body>
</html>
