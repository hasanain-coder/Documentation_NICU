<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Dose Calculator | Baghdad Teaching Hospital</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #F0F4F3;
            --fg: #1C2526;
            --muted: #5A6872;
            --accent: #0F766E;
            --accent-light: #14B8A6;
            --card: #FFFFFF;
            --border: #D1DEDD;
            --danger: #B91C1C;
            --surface: #E8EFEE;
        }

        * { font-family: 'Inter', 'Noto Sans Arabic', sans-serif; }
        h1, h2, h3 { font-family: 'Crimson Pro', serif; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 0% 0%, rgba(15, 118, 110, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(20, 184, 166, 0.04) 0%, transparent 50%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease-out forwards; }
        .patient-card { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }

        /* Form Elements */
        .input-field { 
            transition: all 0.2s ease; 
            background: var(--surface); 
        }
        .input-field:focus { 
            background: var(--card);
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            transition: all 0.25s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .arabic-text { font-family: 'Noto Sans Arabic', sans-serif; direction: rtl; text-align: right; }

        /* PDF Render Styles (Hidden from screen) */
        #pdf-render-container { position: absolute; left: -9999px; top: 0; background: white; }
        .pdf-page { width: 297mm; height: 210mm; padding: 10mm; background: white; box-sizing: border-box; page-break-after: always; }
        .pdf-header { background: #0F766E; color: white; padding: 4mm; text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 5mm; border-radius: 3mm; }
        .pdf-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4mm; height: calc(100% - 20mm); }
        .pdf-cell { border: 1px solid #D1DEDD; border-radius: 3mm; padding: 3mm; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; }
        .pdf-cell-header { background: #F0F4F3; margin: -3mm -3mm 2mm -3mm; padding: 2mm 3mm; border-radius: 3mm 3mm 0 0; border-bottom: 1px solid #D1DEDD; }
        .pdf-drug-item { margin-bottom: 2mm; padding-bottom: 2mm; border-bottom: 1px dashed #E8EFEE; }
        .pdf-drug-item:last-child { border-bottom: none; }
        .pdf-dopa-table { width: 100%; border-collapse: collapse; margin-top: 1mm; font-size: 8pt; text-align: center; }
        .pdf-dopa-table th { background: #0F766E; color: white; padding: 1mm; }
        .pdf-dopa-table td { border: 1px solid #D1DEDD; padding: 1mm; }
    </style>
</head>

<body class="min-h-screen">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-[var(--border)] shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[var(--accent-light)] flex items-center justify-center shadow-md">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[var(--fg)] tracking-tight">NICU Dose Calculator</h1>
                    <p class="text-xs text-[var(--muted)]">Baghdad Teaching Hospital</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
        <section id="inputSection" class="bg-white rounded-2xl shadow-lg border border-[var(--border)] overflow-hidden animate-fade-up">
            <div class="bg-gradient-to-r from-[var(--accent)] to-[var(--accent-light)] px-6 py-4">
                <h2 class="text-xl text-white font-semibold">Patient Information</h2>
            </div>
            
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Patient Name</label>
                        <input type="text" id="inputName" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]" placeholder="Full name">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Weight (kg)</label>
                        <input type="text" id="inputWeight" inputmode="decimal" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]" placeholder="e.g., 2.35">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Postnatal Age</label>
                        <select id="inputAge" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]"></select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-[var(--fg)]">Gestational Age</label>
                        <input type="number" id="inputGA" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]" placeholder="e.g., 34">
                    </div>
                </div>

                <div class="border-t border-[var(--border)] pt-6">
                    <h3 class="text-lg font-semibold text-[var(--fg)] mb-4">Medication & Dosage</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-[var(--fg)]">Drug</label>
                            <select id="selectDrug" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]"></select>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-[var(--fg)]">Dose (Calculated)</label>
                            <input type="text" id="inputDose" disabled class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)] bg-gray-50" placeholder="Auto">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-[var(--fg)]">Frequency</label>
                            <select id="inputFreq" class="input-field w-full px-4 py-3 rounded-xl border border-[var(--border)]">
                                <option value="1">1 time daily</option>
                                <option value="2">2 times daily</option>
                                <option value="3">3 times daily</option>
                                <option value="4">4 times daily</option>
                                <option value="q36h">Every 36 hours</option>
                                <option value="q48h">Every 48 hours</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold text-[var(--fg)]">Action</label>
                            <button id="btnAddDrug" class="btn-primary w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2">
                                Add Drug
                            </button>
                        </div>
                    </div>

                    <div id="methodPreviewContainer" class="hidden bg-[var(--surface)] rounded-xl p-4 mb-4">
                        <p class="text-xs font-semibold text-[var(--accent)] mb-1">Method of Administration</p>
                        <p id="previewMethod" class="text-[var(--fg)] arabic-text text-sm">-</p>
                    </div>

                    <div id="dopamineTableContainer" class="hidden overflow-x-auto mb-4">
                        <table class="w-full text-sm border border-[var(--border)] rounded-xl overflow-hidden">
                            <thead class="bg-[var(--accent)] text-white">
                                <tr>
                                    <th class="p-2">Rate (ml/hr)</th>
                                    <th class="p-2">Dose (mcg/kg/min)</th>
                                </tr>
                            </thead>
                            <tbody id="dopamineTableBody" class="bg-white"></tbody>
                        </table>
                    </div>
                </div>

                <div id="drugsList" class="mt-4 space-y-2"></div>
                <button id="btnSavePatient" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-4">
                    Save Patient to Queue
                </button>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row justify-between gap-4">
                <div class="flex items-center gap-4">
                    <h2 class="text-2xl font-bold text-[var(--fg)]">Patient Queue</h2>
                    <label class="flex items-center gap-2 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-[var(--border)]">
                        <input type="checkbox" id="selectAllCheckbox" class="w-4 h-4 text-[var(--accent)]">
                        <span class="text-sm font-medium">Select All</span>
                    </label>
                </div>
                <div class="flex gap-2 flex-wrap">
                    <button id="btnPdf" disabled class="btn-primary px-5 py-2.5 rounded-xl text-white font-medium">Generate PDF</button>
                    <button id="btnClearAll" class="px-5 py-2.5 rounded-xl border border-[var(--danger)]/30 text-[var(--danger)] font-medium hover:bg-[var(--danger)]/5">Clear All</button>
                </div>
            </div>
            
            <div id="patientQueue" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <div id="pdf-render-container"></div>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 opacity-0 transition-all duration-300 pointer-events-none text-white">
        <span id="toastMsg">Message</span>
    </div>

    <script>
        /**
         * 1. CONFIGURATION & STATE
         * ----------------------------------------
         */
        const DRUG_CONFIG = [
            { id: 1, name: 'Amoxicillin', dosePerKg: 50, factor: 100, method: 'تخفف مع 3 ml كلوكوز وتر وتعطى خلال 5 دقائق', defaultFreq: '2' },
            { id: 2, name: 'Gentamicin', dosePerKg: 5, factor: 40, method: 'تخفف بـ 5 ml كلوكوز وتر ويعطى خلال 10 دقائق', defaultFreq: '1' },
            { id: 3, name: 'Cefotaxime', dosePerKg: 50, factor: 100, method: 'تعطى خلال 5 دقائق', defaultFreq: '2' },
            { id: 8, name: 'Meropenem', dosePerKg: 40, factor: 50, method: 'تضاف إلى 10 ml كلوكوز وتر، تفرغ 10 ml وتعطى 10 خلال 30 دقيقة', defaultFreq: '3' },
            { id: 9, name: 'Dopamine', isDopamine: true, method: 'يبدأ بمعدل 5 mcg/kg/min ويزداد تدريجياً حسب الاستجابة', defaultFreq: '1' },
            { id: 14, name: 'Phenobarbital Load', dosePerKg: 20, factor: 200, method: 'تضاف إلى 10 ml كلوكوز وتر، وتعطى خلال 30 دقيقة', defaultFreq: '1' },
            { id: 15, name: 'Phenobarbital Maint.', dosePerKg: 2.5, factor: 200, method: 'يعطى عن طريق الفم أو الحقن الوريدي البطيء', defaultFreq: '1' },
            { id: 16, name: 'Colistin', dosePerKg: 150000, factor: 500000, method: 'تعطى وريدياً بشكل بطيء', defaultFreq: '3' }
        ];

        let state = {
            patients: JSON.parse(localStorage.getItem('nicu_queue')) || [],
            currentDrugs: [],
            selectedIds: new Set(),
            currentEditingId: null
        };

        const getEl = (id) => document.getElementById(id);

        /**
         * 2. UTILITY FUNCTIONS
         * ----------------------------------------
         */
        const utils = {
            // Converts Arabic numbers and commas to standard floats
            cleanWeightInput: (inputString) => {
                if (!inputString) return 0;
                let val = inputString.toString().replace(/،/g, '.');
                const arabicNumbers = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
                arabicNumbers.forEach((char, index) => {
                    val = val.replace(new RegExp(char, 'g'), index);
                });
                return parseFloat(val.replace(/[^0-9.]/g, '')) || 0;
            },

            showToast: (message, isError = false) => {
                const toastEl = getEl('toast');
                getEl('toastMsg').textContent = message;
                toastEl.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 transition-all duration-300 ${isError ? 'bg-red-600' : 'bg-teal-700'} text-white`;
                toastEl.style.opacity = '1'; 
                toastEl.style.transform = 'translate(-50%, 0)';
                
                setTimeout(() => { 
                    toastEl.style.opacity = '0'; 
                    toastEl.style.transform = 'translate(-50%, 16px)'; 
                }, 3000);
            }
        };

        /**
         * 3. CORE BUSINESS LOGIC
         * ----------------------------------------
         */
        const logic = {
            calculateDrugDose: (drug, weight) => {
                if (drug.isDopamine) {
                    return { method: drug.method, doseText: 'Infusion' };
                }

                let dose = drug.dosePerKg * weight;
                let factor = drug.factor;
                let methodStr = drug.method;

                // Handle specific condition: weight under 1 kg
                if (weight < 1) {
                    if (drug.doseUnder1Kg) dose = drug.doseUnder1Kg * weight;
                    if (drug.factorUnder1Kg) factor = drug.factorUnder1Kg;
                    if (drug.methodUnder1Kg) methodStr = drug.methodUnder1Kg;
                }

                // Calculate volume and determine ml vs unit
                const volumeInMl = dose / factor;
                let drawText = '';

                if (volumeInMl < 1) {
                    // Convert to insulin units if less than 1 ml
                    const units = Math.round(volumeInMl * 100);
                    drawText = `${units} unit`;
                } else {
                    drawText = `${volumeInMl.toFixed(2)} ml`;
                }

                // Formatting special cases (like Colistin UI vs mg)
                const doseDisplay = drug.id === 16 ? `${dose.toLocaleString()} IU` : `${dose.toFixed(1)} mg`;
                const finalMethod = `تسحب ${drawText} و${methodStr}`;
                
                return { method: finalMethod, doseText: doseDisplay };
            },

            generateDopamineTableRows: (weight, isForPDF = false) => {
                let rows = '';
                for (let dose = 5; dose <= 20; dose += 5) {
                    const rate = ((dose * weight * 60) / 4000).toFixed(1);
                    if (isForPDF) {
                        rows += `<tr><td>${rate} ml/hr</td><td>${dose} mcg</td></tr>`;
                    } else {
                        rows += `<tr class="border-b"><td class="p-2 text-center text-teal-700 font-bold">${rate} ml/hr</td><td class="p-2 text-center">${dose} mcg</td></tr>`;
                    }
                }
                return rows;
            }
        };

        /**
         * 4. UI RENDERING & UPDATES
         * ----------------------------------------
         */
        const ui = {
            updatePatientQueue: () => {
                const queueContainer = getEl('patientQueue');
                
                queueContainer.innerHTML = state.patients.map((patient, index) => `
                    <div class="patient-card bg-white rounded-xl shadow-sm border border-[var(--border)] relative" style="animation-delay: ${index * 50}ms">
                        <div class="absolute top-3 left-3 z-10">
                            <input type="checkbox" onchange="togglePatientSelection('${patient.id}')" ${state.selectedIds.has(patient.id) ? 'checked' : ''} class="w-5 h-5 accent-[var(--accent)]">
                        </div>
                        <div class="bg-teal-600 px-4 py-2 pl-10 text-white rounded-t-xl">
                            <h3 class="font-bold truncate">${patient.name}</h3>
                            <p class="text-xs opacity-90">${patient.weight}kg | Day ${patient.age} | ${patient.ga}w</p>
                        </div>
                        <div class="p-4 space-y-2 max-h-48 overflow-y-auto">
                            ${patient.drugs.map(drug => `
                                <div class="border-b pb-2 last:border-0">
                                    <div class="flex justify-between font-bold text-sm">
                                        <span>${drug.name} (${drug.freq})</span>
                                        <span class="text-teal-700">${drug.doseText}</span>
                                    </div>
                                    <div class="text-xs text-gray-500 arabic-text">${drug.method}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="p-3 flex gap-2 border-t">
                            <button onclick="editPatientData('${patient.id}')" class="flex-1 py-1.5 text-sm rounded bg-teal-50 text-teal-700 font-medium">Edit</button>
                            <button onclick="deletePatientRecord('${patient.id}')" class="flex-1 py-1.5 text-sm rounded bg-red-50 text-red-600 font-medium">Delete</button>
                        </div>
                    </div>
                `).join('');
                
                // Update button states
                getEl('btnPdf').disabled = state.selectedIds.size === 0;
                getEl('selectAllCheckbox').checked = state.patients.length > 0 && state.selectedIds.size === state.patients.length;
                
                // Persist state
                localStorage.setItem('nicu_queue', JSON.stringify(state.patients));
            },

            updateActiveDrugsList: () => {
                getEl('drugsList').innerHTML = state.currentDrugs.map((drug, index) => `
                    <div class="bg-gray-50 border rounded-lg p-3 flex justify-between items-start">
                        <div>
                            <div class="font-bold">${drug.name} <span class="text-xs bg-teal-100 text-teal-800 px-2 rounded">${drug.freq}</span></div>
                            <div class="text-sm text-teal-700">${drug.doseText}</div>
                            <div class="text-xs text-gray-600 arabic-text mt-1">${drug.method}</div>
                        </div>
                        <button onclick="removeDrugFromList(${index})" class="text-red-500 text-xl px-2 hover:bg-red-50 rounded">&times;</button>
                    </div>
                `).join('');
            },

            handleDrugSelectionChange: () => {
                const weight = utils.cleanWeightInput(getEl('inputWeight').value);
                const selectedDrug = DRUG_CONFIG.find(drug => drug.id == getEl('selectDrug').value);
                
                getEl('inputFreq').value = selectedDrug.defaultFreq;
                
                if (selectedDrug.isDopamine) {
                    getEl('dopamineTableContainer').classList.remove('hidden');
                    getEl('methodPreviewContainer').classList.add('hidden');
                    getEl('inputDose').value = 'Infusion Table';
                    
                    if (weight > 0) {
                        getEl('dopamineTableBody').innerHTML = logic.generateDopamineTableRows(weight, false);
                    }
                } else {
                    getEl('dopamineTableContainer').classList.add('hidden');
                    getEl('methodPreviewContainer').classList.remove('hidden');
                    
                    if (weight > 0) {
                        const calculation = logic.calculateDrugDose(selectedDrug, weight);
                        getEl('inputDose').value = calculation.doseText;
                        getEl('previewMethod').textContent = calculation.method;
                    }
                }
            }
        };

        /**
         * 5. EVENT LISTENERS & GLOBAL ACTIONS
         * ----------------------------------------
         */
        // Initialization
        const initApp = () => {
            getEl('inputAge').innerHTML = '<option value="">Select</option>' + Array.from({length:30}, (_,i) => `<option value="${i+1}">Day ${i+1}</option>`).join('');
            getEl('selectDrug').innerHTML = DRUG_CONFIG.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            
            ui.updatePatientQueue();
            ui.handleDrugSelectionChange();
        };

        // Inputs Triggers
        getEl('selectDrug').addEventListener('change', ui.handleDrugSelectionChange);
        getEl('inputWeight').addEventListener('input', ui.handleDrugSelectionChange);

        // Add Drug to Current Patient
        getEl('btnAddDrug').addEventListener('click', () => {
            const weight = utils.cleanWeightInput(getEl('inputWeight').value);
            if (weight <= 0) return utils.showToast('Please enter a valid weight', true);
            
            const selectedDrug = DRUG_CONFIG.find(d => d.id == getEl('selectDrug').value);
            const freqSelector = getEl('inputFreq');
            const freqText = freqSelector.options[freqSelector.selectedIndex].text;
            
            let doseData = { method: selectedDrug.method, doseText: 'Infusion' };
            if (!selectedDrug.isDopamine) {
                doseData = logic.calculateDrugDose(selectedDrug, weight);
            }

            state.currentDrugs.push({ 
                ...selectedDrug, 
                doseText: doseData.doseText, 
                method: doseData.method, 
                freq: freqText 
            });
            
            ui.updateActiveDrugsList();
            utils.showToast(`${selectedDrug.name} added successfully`);
        });

        // Save Patient
        getEl('btnSavePatient').addEventListener('click', () => {
            const name = getEl('inputName').value.trim();
            const weight = utils.cleanWeightInput(getEl('inputWeight').value);
            
            if (!name || weight <= 0 || state.currentDrugs.length === 0) {
                return utils.showToast('Please complete all fields and add at least one drug', true);
            }

            state.patients.push({
                id: state.currentEditingId || Date.now().toString(),
                name, weight, age: getEl('inputAge').value, ga: getEl('inputGA').value,
                drugs: [...state.currentDrugs]
            });

            // Reset Form
            state.currentEditingId = null;
            getEl('inputName').value = ''; 
            getEl('inputWeight').value = ''; 
            state.currentDrugs = []; 
            
            ui.updateActiveDrugsList(); 
            ui.updatePatientQueue();
            
            utils.showToast('Patient Saved to Queue');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        // Global Window Functions (for inline HTML onclick handlers)
        window.removeDrugFromList = (index) => {
            state.currentDrugs.splice(index, 1);
            ui.updateActiveDrugsList();
        };

        window.deletePatientRecord = (id) => {
            state.patients = state.patients.filter(p => p.id !== id);
            state.selectedIds.delete(id);
            ui.updatePatientQueue();
        };

        window.togglePatientSelection = (id) => {
            state.selectedIds.has(id) ? state.selectedIds.delete(id) : state.selectedIds.add(id);
            ui.updatePatientQueue();
        };

        window.editPatientData = (id) => {
            const patient = state.patients.find(p => p.id === id);
            if(!patient) return;
            
            getEl('inputName').value = patient.name; 
            getEl('inputWeight').value = patient.weight;
            getEl('inputAge').value = patient.age; 
            getEl('inputGA').value = patient.ga;
            
            state.currentDrugs = [...patient.drugs]; 
            state.currentEditingId = id;
            
            // Remove from queue while editing
            state.patients = state.patients.filter(p => p.id !== id); 
            state.selectedIds.delete(id);
            
            ui.updateActiveDrugsList(); 
            ui.updatePatientQueue();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            utils.showToast('Ready to edit patient data', false);
        };

        // Mass Actions
        getEl('selectAllCheckbox').addEventListener('change', (e) => {
            if (e.target.checked) {
                state.patients.forEach(p => state.selectedIds.add(p.id));
            } else {
                state.selectedIds.clear();
            }
            ui.updatePatientQueue();
        });

        getEl('btnClearAll').addEventListener('click', () => { 
            if(confirm('Are you sure you want to clear all patients from the queue?')) { 
                state.patients = []; 
                state.selectedIds.clear(); 
                ui.updatePatientQueue(); 
            }
        });

        /**
         * 6. PDF GENERATOR LOGIC
         * ----------------------------------------
         */
        getEl('btnPdf').addEventListener('click', async () => {
            utils.showToast('Generating PDF...');
            const toPrint = state.patients.filter(p => state.selectedIds.has(p.id));
            const container = getEl('pdf-render-container'); 
            container.innerHTML = '';
            
            let pages = []; 
            let grid = Array(6).fill(null);
            
            // Grid Placement Logic
            toPrint.forEach(patient => {
                const needsMerge = patient.drugs.length >= 4 || patient.drugs.some(d => d.isDopamine);
                let placed = false;
                
                // Try to place merged cell first (span 2 vertically)
                if (needsMerge) {
                    for (let i = 0; i < 3; i++) {
                        if (!grid[i] && !grid[i+3]) { 
                            grid[i] = { patient, span: 2 }; 
                            grid[i+3] = 'blocked'; 
                            placed = true; 
                            break; 
                        }
                    }
                }
                
                // If not merged or merged placement failed, place normally
                if (!placed) {
                    for (let i = 0; i < 6; i++) {
                        if (!grid[i]) { 
                            grid[i] = { patient, span: 1 }; 
                            placed = true; 
                            break; 
                        }
                    }
                }
                
                // If grid is full, create new page
                if (!placed) {
                    pages.push([...grid]); 
                    grid = Array(6).fill(null);
                    if (needsMerge) { 
                        grid[0] = { patient, span: 2 }; 
                        grid[3] = 'blocked'; 
                    } else { 
                        grid[0] = { patient, span: 1 }; 
                    }
                }
            });
            
            // Push remaining grid to pages
            if (grid.some(cell => cell !== null)) {
                pages.push(grid);
            }

            // PDF Construction Setup
            const { jsPDF } = window.jspdf;
            const pdfDocument = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

            // Render Pages
            for (let i = 0; i < pages.length; i++) {
                const pageDiv = document.createElement('div'); 
                pageDiv.className = 'pdf-page';
                pageDiv.innerHTML = `
                    <div class="pdf-header">Baghdad Teaching Hospital | NICU Medical Record</div>
                    <div class="pdf-grid" id="pg-${i}"></div>
                `;
                
                pages[i].forEach((cell, index) => {
                    const cellEl = document.createElement('div');
                    cellEl.style.gridColumn = (index % 3) + 1; 
                    cellEl.style.gridRow = Math.floor(index / 3) + 1;
                    
                    if (!cell || cell === 'blocked') {
                        return pageDiv.querySelector('.pdf-grid').appendChild(cellEl);
                    }
                    
                    if (cell.span === 2) {
                        cellEl.style.gridRow = `${Math.floor(index / 3) + 1} / span 2`;
                    }
                    cellEl.className = 'pdf-cell';
                    
                    let drugsHtml = cell.patient.drugs.map(drug => `
                        <div class="pdf-drug-item">
                            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                                <span>${drug.name} <span style="font-weight:normal; font-size:8pt">(${drug.freq})</span></span>
                                <span>${drug.doseText}</span>
                            </div>
                            <div style="font-size:9pt; text-align:right; direction:rtl; font-family:'Noto Sans Arabic',sans-serif; color:#555;">${drug.method}</div>
                            ${drug.isDopamine ? `<table class="pdf-dopa-table"><thead><tr><th>Rate</th><th>Dose</th></tr></thead><tbody>${logic.generateDopamineTableRows(cell.patient.weight, true)}</tbody></table>` : ''}
                        </div>
                    `).join('');

                    cellEl.innerHTML = `
                        <div class="pdf-cell-header">
                            <div style="font-weight:bold; color:#0F766E; font-size:12pt;">${cell.patient.name}</div>
                            <div style="font-size:9pt; color:#666;">Wt: ${cell.patient.weight}kg | GA: ${cell.patient.ga}w | Day: ${cell.patient.age}</div>
                        </div>
                        <div style="flex:1; overflow:hidden;">${drugsHtml}</div>
                    `;
                    pageDiv.querySelector('.pdf-grid').appendChild(cellEl);
                });
                
                container.appendChild(pageDiv);
                
                // Convert DOM to Image and add to PDF
                const canvas = await html2canvas(pageDiv, { scale: 2 });
                if (i > 0) pdfDocument.addPage();
                pdfDocument.addImage(canvas.toDataURL('image/jpeg', 1.0), 'JPEG', 0, 0, 297, 210);
            }
            
            pdfDocument.save('NICU_Records.pdf');
            container.innerHTML = ''; // Cleanup
        });

        // Bootstrap App
        initApp();
    </script>
</body>
</html>
