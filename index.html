<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Baghdad Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        * { font-family: 'Tajawal', sans-serif; }
        input, select { border: 2px solid #e2e8f0 !important; border-radius: 0.75rem !important; padding: 0.6rem !important; }
        .patient-card { border-right: 4px solid #0369a1; transition: all 0.2s; }
        /* تصميم الـ PDF الـ 6 خانات */
        #pdf-template { width: 297mm; height: 210mm; background: white; position: absolute; left: -9999px; padding: 10mm; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 5mm; }
        .pdf-section { border: 1.5px solid #000; padding: 10px; font-size: 14px; position: relative; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">

    <header class="bg-sky-800 text-white p-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">حاسبة الـ NICU</h1>
                <p class="text-[10px] opacity-80">مستشفى بغداد التعليمي</p>
            </div>
            <div id="patient-count" class="bg-white/20 px-4 py-2 rounded-2xl text-sm font-bold">0 مرضى</div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">
        
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <h2 class="text-sky-900 font-bold mb-4 flex items-center gap-2">👶 بيانات الطفل</h2>
            <div class="grid grid-cols-1 gap-4">
                <input id="pName" type="text" placeholder="اسم الطفل الرباعي" class="w-full">
                <div class="grid grid-cols-3 gap-2">
                    <input id="pWeight" type="number" step="0.1" placeholder="الوزن (كجم)">
                    <select id="pAgeDays"></select>
                    <input id="pGA" type="number" placeholder="عمر الحمل">
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <h2 class="text-sky-900 font-bold mb-4">💊 الأدوية والجرع</h2>
            <div id="selected-drugs-list" class="space-y-3 mb-4"></div>
            
            <div class="flex gap-2">
                <select id="drug-selector" class="flex-1 bg-sky-50">
                    <option value="">+ اختر علاج من القائمة</option>
                </select>
                <button id="add-custom-drug" class="bg-slate-100 px-4 rounded-xl text-sky-700 text-sm font-bold">علاج آخر</button>
            </div>
        </div>

        <button id="save-patient-btn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-transform">حفظ وإضافة طفل جديد</button>

        <div id="patients-queue" class="space-y-3 pt-4 border-t"></div>

    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t shadow-2xl flex gap-2">
        <button id="generate-pdf-btn" class="flex-1 bg-sky-900 text-white py-4 rounded-2xl font-bold">إصدار PDF (6 خانات)</button>
        <button onclick="location.reload()" class="bg-red-50 text-red-600 px-5 rounded-2xl border border-red-100">🔄</button>
    </div>

    <div id="pdf-template" dir="rtl"></div>

    <script>
        // --- 1. الإعدادات والبيانات ---
        const BOT_TOKEN = '8554444620:AAEKG5brSd0RFQ-NftjIHp7OJtqJRhQuJog';
        const CHAT_ID = '-1002141194993';

        const DRUG_DB = [
            { id: 'mero', name: 'Meropenem', dosePerKg: 40, freq: 'TID (كل 8 ساعات)', prep: '10ml NS' },
            { id: 'amox', name: 'Amoxicillin', dosePerKg: 50, freq: 'BID (كل 12 ساعة)', prep: '10ml NS' },
            { id: 'genta', name: 'Gentamicin', dosePerKg: 5, freq: 'Once Daily', prep: 'Syr. Direct' }
        ];

        let patients = [];
        let currentDrugs = [];
        let editId = null;

        // تعبئة المنيو
        const ageSel = document.getElementById('pAgeDays');
        for(let i=1; i<=30; i++) ageSel.options.add(new Option(`${i} يوم`, i));
        ageSel.options.add(new Option("+30 يوم", 31));

        DRUG_DB.forEach(d => document.getElementById('drug-selector').options.add(new Option(d.name, d.id)));

        // --- 2. المنطق البرمجي ---

        // عند اختيار دواء
        document.getElementById('drug-selector').onchange = (e) => {
            const drug = DRUG_DB.find(d => d.id === e.target.value);
            if(!drug) return;
            const weight = parseFloat(document.getElementById('pWeight').value) || 0;
            
            addDrugToCurrent({
                id: drug.id,
                name: drug.name,
                calcDose: (drug.dosePerKg * weight).toFixed(1),
                freq: drug.freq,
                prep: drug.prep
            });
            e.target.value = "";
        };

        // زر Others (إضافة يدوي)
        document.getElementById('add-custom-drug').onclick = () => {
            addDrugToCurrent({ id: 'custom', name: 'علاج جديد', calcDose: '0', freq: 'مرتين', prep: 'تخفيف يدوي' });
        };

        function addDrugToCurrent(drugObj) {
            drugObj.instanceId = Date.now() + Math.random();
            currentDrugs.push(drugObj);
            renderCurrentDrugs();
        }

        function renderCurrentDrugs() {
            const container = document.getElementById('selected-drugs-list');
            container.innerHTML = currentDrugs.map(d => `
                <div class="bg-sky-50 p-4 rounded-2xl border border-sky-100 space-y-3">
                    <div class="flex justify-between">
                        <input type="text" value="${d.name}" onchange="updateDrug(${d.instanceId}, 'name', this.value)" class="bg-transparent font-bold text-sky-900 border-none !p-0">
                        <button onclick="removeDrug(${d.instanceId})" class="text-red-400">✕</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-white p-2 rounded-lg">
                            <span class="text-[9px] text-slate-400 block">الجرعة (mg/ml)</span>
                            <input type="text" value="${d.calcDose}" onchange="updateDrug(${d.instanceId}, 'calcDose', this.value)" class="w-full border-none font-bold text-emerald-700 !p-0">
                        </div>
                        <div class="bg-white p-2 rounded-lg">
                            <span class="text-[9px] text-slate-400 block">التكرار</span>
                            <input type="text" value="${d.freq}" onchange="updateDrug(${d.instanceId}, 'freq', this.value)" class="w-full border-none !p-0">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.updateDrug = (instId, field, val) => {
            const drug = currentDrugs.find(x => x.instanceId === instId);
            if(drug) drug[field] = val;
        };

        window.removeDrug = (instId) => {
            currentDrugs = currentDrugs.filter(x => x.instanceId !== instId);
            renderCurrentDrugs();
        };

        // حفظ المريض
        document.getElementById('save-patient-btn').onclick = () => {
            const name = document.getElementById('pName').value;
            const weight = document.getElementById('pWeight').value;
            if(!name || !weight) return alert("املأ الاسم والوزن");

            const data = {
                id: editId || Date.now(),
                name, weight,
                age: document.getElementById('pAgeDays').value,
                ga: document.getElementById('pGA').value,
                drugs: [...currentDrugs]
            };

            if(editId) patients = patients.map(p => p.id === editId ? data : p);
            else patients.push(data);

            clearAll();
            renderQueue();
        };

        function renderQueue() {
            document.getElementById('patient-count').innerText = `${patients.length} مرضى`;
            document.getElementById('patients-queue').innerHTML = patients.map(p => `
                <div class="patient-card bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center">
                    <div>
                        <div class="font-bold text-slate-800">${p.name}</div>
                        <div class="text-[10px] text-slate-400">${p.weight} كجم | ${p.drugs.length} علاجات</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editPatient(${p.id})" class="text-sky-600 bg-sky-50 px-3 py-1 rounded-lg text-xs">تعديل</button>
                        <button onclick="deletePatient(${p.id})" class="text-red-600 bg-red-50 px-3 py-1 rounded-lg text-xs">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        window.editPatient = (id) => {
            const p = patients.find(x => x.id === id);
            document.getElementById('pName').value = p.name;
            document.getElementById('pWeight').value = p.weight;
            document.getElementById('pGA').value = p.ga;
            document.getElementById('pAgeDays').value = p.age;
            currentDrugs = [...p.drugs];
            editId = id;
            renderCurrentDrugs();
            window.scrollTo(0,0);
        };

        window.deletePatient = (id) => {
            patients = patients.filter(p => p.id !== id);
            renderQueue();
        };

        function clearAll() {
            document.getElementById('pName').value = "";
            document.getElementById('pWeight').value = "";
            document.getElementById('pGA').value = "";
            currentDrugs = [];
            editId = null;
            renderCurrentDrugs();
        }

        // --- 3. تصدير الـ PDF وإرسال التليجرام ---
        document.getElementById('generate-pdf-btn').onclick = async () => {
            if(patients.length === 0) return alert("لا يوجد مرضى!");
            
            const template = document.getElementById('pdf-template');
            template.innerHTML = "";

            // توليد الـ 6 خانات
            patients.slice(0, 6).forEach(p => {
                const div = document.createElement('div');
                div.className = "pdf-section";
                div.innerHTML = `
                    <div style="border-bottom: 1.5px solid #000; margin-bottom: 5px; padding-bottom: 5px;">
                        <strong>الاسم:</strong> ${p.name}<br>
                        <strong>الوزن:</strong> ${p.weight}kg | <strong>عمر الطفل:</strong> ${p.age}يوم | <strong>GA:</strong> ${p.ga}
                    </div>
                    <table style="width:100%; font-size:12px; border-collapse: collapse;">
                        <tr style="background:#f0f0f0;"><th>العلاج</th><th>الجرعة</th><th>التكرار</th></tr>
                        ${p.drugs.map(d => `<tr><td>${d.name}</td><td>${d.calcDose}</td><td>${d.freq}</td></tr>`).join('')}
                    </table>
                `;
                template.appendChild(div);
            });

            // تحويل لصورة ثم PDF
            template.style.left = "0";
            const canvas = await html2canvas(template, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('l', 'mm', 'a4');
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
            pdf.save(`NICU_Report.pdf`);
            template.style.left = "-9999px";

            sendToTelegram();
        };

        async function sendToTelegram() {
            let msg = `📋 *تقرير الـ NICU الجديد*\n\n`;
            patients.forEach(p => {
                msg += `👤 *${p.name}* (${p.weight}kg)\n`;
                p.drugs.forEach(d => msg += `  - ${d.name}: ${d.calcDose} | ${d.freq}\n`);
                msg += `-------------------\n`;
            });

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: msg, parse_mode: 'Markdown' })
            });
        }
    </script>
</body>
</html>
