<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Dose Calculator | Baghdad Teaching Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0F4F3;
            --fg: #1C2526;
            --muted: #5A6872;
            --accent: #0F766E;
            --accent-light: #14B8A6;
            --card: #FFFFFF;
            --border: #D1DEDD;
            --danger: #B91C1C;
            --surface: #E8EFEE;
        }

        * { 
            font-family: 'Inter', 'Cairo', 'Noto Sans Arabic', sans-serif; 
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }
        
        h1, h2, h3, .display-font { font-family: 'Crimson Pro', serif; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 0% 0%, rgba(15, 118, 110, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(20, 184, 166, 0.04) 0%, transparent 50%);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            transition: all 0.25s ease;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
        }

        .arabic-text {
            font-family: 'Cairo', 'Noto Sans Arabic', sans-serif;
            direction: rtl;
            text-align: right;
        }

        #pdf-render-container {
            position: absolute;
            top: 0; left: 0; z-index: -1000; opacity: 0; pointer-events: none;
            background: white;
        }
        
        .pdf-page { width: 210mm; height: 297mm; padding: 8mm; background: white; box-sizing: border-box; }
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3mm; height: 100%; }
        .pdf-cell { border: 2px solid #000; border-radius: 2mm; padding: 3mm; position: relative; display: flex; flex-direction: column; }
        .pdf-cell-header { border-bottom: 2px solid #000; margin-bottom: 2mm; padding-bottom: 1mm; }
        .pdf-drug-item { border-bottom: 1px dashed #999; padding-bottom: 1.5mm; margin-bottom: 1.5mm; }
        .pdf-drug-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-[var(--border)] shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[var(--accent-light)] flex items-center justify-center shadow-md">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-[var(--fg)] tracking-tight">NICU Dose Calculator</h1>
                    <p class="text-xs text-[var(--muted)]">Baghdad Teaching Hospital</p>
                </div>
            </div>
            <div id="patientCounter" class="hidden px-4 py-2 rounded-full bg-[var(--accent)]/10 border border-[var(--accent)]/20">
                <span class="text-[var(--accent)] font-semibold text-sm" id="counterText">0 Patients</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
        <section id="inputSection" class="bg-white rounded-2xl shadow-lg border border-[var(--border)] overflow-hidden">
            <div class="bg-gradient-to-r from-[var(--accent)] to-[var(--accent-light)] px-6 py-4 text-white">
                <h2 class="text-xl font-semibold">Patient Information</h2>
            </div>

            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Patient Name</label>
                        <input type="text" id="inputName" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none" placeholder="Full name">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Weight (kg)</label>
                        <input type="text" id="inputWeight" inputmode="decimal" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none" placeholder="e.g., 2.35">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Postnatal Age (Days)</label>
                        <select id="inputAge" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">GA (weeks)</label>
                        <input type="text" id="inputGA" inputmode="decimal" class="w-full px-4 py-3 rounded-xl border border-[var(--border)] focus:border-[var(--accent)] outline-none" placeholder="e.g., 34">
                    </div>
                </div>

                <div class="border-t pt-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4 items-start">
                        <div class="lg:col-span-1">
                            <label class="block text-sm font-semibold mb-1">Category</label>
                            <select id="selectCategory" class="w-full px-4 py-3 rounded-xl border border-[var(--border)]"></select>
                        </div>
                        <div class="lg:col-span-1">
                            <label class="block text-sm font-semibold mb-1">Drug</label>
                            <select id="selectDrug" class="w-full px-4 py-3 rounded-xl border border-[var(--border)]"></select>
                            <input type="text" id="inputCustomDrug" class="hidden w-full px-4 py-3 rounded-xl border mt-2" placeholder="Drug Name">
                        </div>
                        <div class="lg:col-span-2">
                            <div class="grid grid-cols-2 gap-2">
                                <div id="dosePerKgContainer" class="hidden">
                                    <label class="block text-sm font-semibold text-[var(--accent)] mb-1">Dose/kg</label>
                                    <input type="text" id="inputDosePerKg" class="w-full px-3 py-3 rounded-xl border border-[var(--accent)]/30 font-bold">
                                </div>
                                <div id="totalDoseContainer">
                                    <label class="block text-sm font-semibold mb-1" id="labelTotalDose">Total Dose</label>
                                    <div class="flex gap-1">
                                        <input type="text" id="inputDose" class="w-full px-3 py-3 rounded-xl border border-[var(--border)]">
                                        <input type="text" id="inputCustomUnit" class="hidden w-16 px-1 py-3 rounded-xl border" placeholder="Unit">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="lg:col-span-1" id="freqContainer">
                            <label class="block text-sm font-semibold mb-1">Frequency</label>
                            <select id="inputFreq" class="w-full px-4 py-3 rounded-xl border border-[var(--border)]">
                                <option value="1">Once (x 1)</option>
                                <option value="2">Twice (x 2)</option>
                                <option value="3">Three (x 3)</option>
                                <option value="4">Four (x 4)</option>
                                <option value="q36hr">q36hr</option>
                                <option value="q48hr">q48hr</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 hidden" id="targetVolContainer">
                            <label class="block text-sm font-semibold text-[var(--accent)] mb-1">Target Vol</label>
                            <select id="inputTargetVol" class="w-full px-4 py-3 rounded-xl border bg-[var(--accent)]/5">
                                <option value="10">10 ml (x2)</option>
                                <option value="5">5 ml (x3)</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 flex flex-col gap-2">
                             <div id="addonContainer" class="hidden grid grid-cols-2 gap-2">
                                <input type="text" id="inputAddonVol" class="w-full px-2 py-2 rounded-lg border text-sm" placeholder="Vol ml">
                                <input type="text" id="inputAddonType" class="w-full px-2 py-2 rounded-lg border text-sm" placeholder="KCL">
                            </div>
                            <button id="btnAddDrug" class="btn-primary w-full py-3 rounded-xl text-white font-semibold h-[50px]">Add</button>
                        </div>
                    </div>

                    <div id="methodPreviewContainer" class="hidden bg-[var(--surface)] border border-[var(--accent)]/20 rounded-xl p-4 mt-4">
                        <p class="text-xs font-bold text-[var(--accent)] uppercase mb-1">Method of Administration</p>
                        <p id="previewMethod" class="text-[var(--fg)] text-sm font-bold">-</p>
                        <p id="warningMessage" class="hidden text-sm text-[var(--danger)] font-bold mt-2 arabic-text"></p>
                    </div>
                </div>

                <div id="dopamineTableContainer" class="hidden mt-6 overflow-x-auto">
                    <h4 class="text-lg font-bold text-[var(--accent)] mb-3">Dopamine Infusion Table</h4>
                    <table class="w-full text-sm border">
                        <thead class="bg-[var(--accent)] text-white"><tr><th class="p-2">Rate (ml/24hr)</th><th class="p-2">Dose (mcg/kg/min)</th></tr></thead>
                        <tbody id="dopamineTableBody" class="bg-white"></tbody>
                    </table>
                </div>

                <div id="drugsList" class="mt-4 space-y-2"></div>
                <button id="btnSavePatient" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg mt-6">Save Patient to Queue</button>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Patient Queue</h2>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="selectAllCheckbox" class="w-5 h-5">
                    <span class="text-sm font-medium">Select All</span>
                </label>
            </div>
            <div class="flex gap-2">
                <button id="btnPdf" disabled class="btn-primary px-5 py-2.5 rounded-xl text-white font-medium">Generate PDF</button>
                <button id="btnClearAll" class="px-5 py-2.5 rounded-xl border border-red-300 text-red-600 font-medium">Clear All</button>
            </div>
            <div id="patientQueue" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="emptyState" class="text-center py-20 bg-white rounded-2xl border-2 border-dashed">No patients in queue</div>
        </section>
    </main>

    <div id="pdf-render-container"></div>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 opacity-0 transition-all pointer-events-none">
        <span id="toastMsg"></span>
    </div>

    <script>
        const METHODS = {
            1: '** / 5min',
            2: '** + 5 ml GW / 10 min',
            3: '** + ## ml GW >> ^^ ml /30 min',
            4: '** + 3 ml GW / 3 min',
            5: '** / 60 min',
            6: 'over 24 hr',
            7: 'Special Nutrients',
            8: '** <span class="arabic-text">مع المغذي</span>',
            9: 'كل اثنين وخميس',
            10: '** + ## ml GW >> ^^ ml /24 hr',
            11: '** + 3ml NS / 15 min <span class="arabic-text">تبخير</span>',
            12: 'تحل الكبسولة ب ٢ سي سي كلوكوز وتر، OG، ثم ٢ سي سي كلوكوز وتر',
            13: 'بالفم',
            14: '3ml NS / 15 min <span class="arabic-text">تبخير</span>'
        };

        const DRUG_CONFIG = [
            { id: 1, name: 'Amoxicillin', dosePerKg: 50, unit: 'mg', factor: 50, methodIndex: 1, 
              warning_rule: (ga, age, freq) => {
                  let rec = (age < 8) ? '2' : '3';
                  return (freq !== rec) ? `⚠️ التردد المقترح بناءً على العمر هو كل ${rec === '2' ? '12' : '8'} ساعة` : null;
              }},
            { id: 2, name: 'Gentamicin', dosePerKg: 5, unit: 'mg', factor: 40, methodIndex: 2, 
              warning_rule: (ga, age, freq) => {
                  let rec;
                  if (ga <= 29) rec = (age <= 14) ? 'q48hr' : 'q36hr';
                  else if (ga <= 34) rec = 'q36hr';
                  else rec = '1';
                  return (freq !== rec) ? `⚠️ التردد المقترح هو ${rec}` : null;
              }},
            { id: 3, name: 'Caffeine Loading', dosePerKg: 20, unit: 'mg', factor: 20, methodIndex: 3, defaultFreq: 1 },
            { id: 4, name: 'Caffeine Maint.', dosePerKg: 10, unit: 'mg', factor: 20, methodIndex: 2, defaultFreq: 1 },
            { id: 5, name: 'Colistin Loading', dosePerKg: 150000, unit: 'IU', factor: 500000, methodIndex: 2, defaultFreq: 1 },
            { id: 6, name: 'Colistin Maint.', dosePerKg: 37500, unit: 'IU', factor: 500000, methodIndex: 2, defaultFreq: 2 },
            { id: 11, name: 'Vancomycin', dosePerKg: 15, unit: 'mg', factor: 2, methodIndex: 5, 
              warning_rule: (ga, age, freq) => {
                  const w = parseFloat(document.getElementById('inputWeight').value) || 0;
                  let rec = (age < 7) ? (w < 1.2 ? '1' : (w <= 2 ? '2' : '3')) : (w < 1.2 ? '1' : '3');
                  return (freq !== rec) ? `⚠️ التردد المقترح للوزن هو ${rec}` : null;
              }},
            { id: 13, name: '1/5 GS', isNutrient: true, methodIndex: 7 },
            { id: 14, name: '10% GW', isNutrient: true, methodIndex: 7 },
            { id: 12, name: 'TPN', methodIndex: 6, hideDetails: true },
            { id: 15, name: '5% GW', isNutrient: true, methodIndex: 7, noPrep: true },
            { id: 17, name: 'Dexmedetomidine', dosePerKg: 0.3, unit: 'mcg', factor: 100, methodIndex: 8, isSpecial: true },
            { id: 22, name: 'Dopamine + fluid', dosePerKg: 5, unit: 'mg', factor: 40, methodIndex: 8, isSpecial: true, isDopamine: true },
            { id: 9, name: 'Dopamine syringe pump', isDopamineTable: true },
            { id: 32, name: 'Ventolin neb.', dosePerKg: 1.25, unit: 'mg', factor: 5, methodIndex: 11 },
            { id: 30, name: 'Vit D drop', dosePerKg: 400, unit: 'IU', factor: 1, methodIndex: 13, defaultFreq: 1 }
        ];

        const DRUG_CATEGORIES = [
            { name: 'Antibiotics', ids: [1, 2, 5, 6, 11] },
            { name: 'Sedatives & Inotropes', ids: [9, 17, 22] },
            { name: 'Fluids', ids: [12, 13, 14, 15] },
            { name: 'Miscellaneous', ids: [3, 4, 30, 32] }
        ];

        let patients = [];
        let currentDrugs = [];
        let selectedPatientIds = new Set();
        const $ = id => document.getElementById(id);

        const cleanNum = str => {
            let n = str.toString().replace(/[،,٫]/g, '.').replace(/[^0-9.]/g, '');
            return parseFloat(n) || 0;
        };

        const generateMethodStr = (drug, dose) => {
            if (drug.isDopamineTable) return '1 ml dopamin + 39 ml GW';
            if (drug.isNutrient) {
                if (drug.noPrep) return " ";
                const vol = dose, addon = cleanNum($('inputAddonVol').value), type = $('inputAddonType').value || 'Add-on';
                let factor = (vol + addon) > 160 ? 0.5 : 1;
                let cV = vol * factor, cA = addon * factor, suffix = factor < 1 ? " X2" : "";
                let prep = drug.name === '1/5 GS' ? `(5% GW ${(cV*0.8).toFixed(0)} + ${(cV*0.2).toFixed(0)} NS)` : `(${drug.name} ${cV.toFixed(0)})`;
                return `${vol}ml ${addon?`(+${addon}${type})`:''} | ${prep}${cA?` + ${cA.toFixed(0)}${type}`:''}${suffix}`;
            }
            let str = METHODS[drug.methodIndex] || '-';
            let drawn = dose / drug.factor;
            if (drug.methodIndex === 3 || drug.methodIndex === 10) {
                const t = parseInt($('inputTargetVol').value) || 10;
                drawn *= (t === 10 ? 2 : 3);
                str = str.replace('^^', t).replace('##', (20-drawn).toFixed(0));
            }
            let unit = drawn < 1 ? ' units' : ' ml', val = unit === ' units' ? Math.round(drawn * 100) : drawn.toFixed(1);
            return str.replace('**', `${val}${unit}`);
        };

        const updatePreview = () => {
            const drug = DRUG_CONFIG.find(d => d.id == $('selectDrug').value);
            if (!drug) return;
            const dose = cleanNum($('inputDose').value);
            $('previewMethod').innerHTML = generateMethodStr(drug, dose);
            $('methodPreviewContainer').classList.remove('hidden');
            
            const ga = cleanNum($('inputGA').value), age = parseInt($('inputAge').value) || 0, freq = $('inputFreq').value;
            const warn = drug.warning_rule ? drug.warning_rule(ga, age, freq) : null;
            $('warningMessage').textContent = warn || '';
            $('warningMessage').classList.toggle('hidden', !warn);
        };

        $('selectCategory').addEventListener('change', e => {
            const cat = DRUG_CATEGORIES.find(c => c.name === e.target.value);
            let opts = '<option value="">-- Select Drug --</option>';
            if (cat) cat.ids.forEach(id => opts += `<option value="${id}">${DRUG_CONFIG.find(d => d.id === id).name}</option>`);
            $('selectDrug').innerHTML = opts;
            $('freqContainer').classList.toggle('hidden', e.target.value === 'Fluids');
        });

        $('selectDrug').addEventListener('change', e => {
            const drug = DRUG_CONFIG.find(d => d.id == e.target.value);
            if (!drug) return;
            const w = cleanNum($('inputWeight').value);
            $('targetVolContainer').classList.toggle('hidden', ![3, 10].includes(drug.methodIndex));
            $('addonContainer').classList.toggle('hidden', !drug.isNutrient || drug.noPrep);
            
            if (drug.isDopamineTable) {
                $('dopamineTableContainer').classList.remove('hidden');
                $('dopamineTableBody').innerHTML = [2, 5, 7, 10].map(d => `<tr><td class="p-2 border text-center font-bold">${(d*w*1.44).toFixed(0)} ml/24h</td><td class="p-2 border text-center">${d} mcg</td></tr>`).join('');
            } else {
                $('dopamineTableContainer').classList.add('hidden');
                $('dosePerKgContainer').classList.toggle('hidden', !drug.isSpecial);
                if (drug.isSpecial) $('inputDosePerKg').value = drug.dosePerKg;
                $('inputDose').value = drug.dosePerKg ? (drug.isDopamine ? (w*5*1.44).toFixed(1) : (w*drug.dosePerKg).toFixed(1)) : '';
                updatePreview();
            }
        });

        $('btnAddDrug').addEventListener('click', () => {
            const drug = DRUG_CONFIG.find(d => d.id == $('selectDrug').value);
            if (!drug) return;
            currentDrugs.push({
                name: drug.name, dose: $('inputDose').value, unit: drug.unit || 'ml',
                freq: $('inputFreq').value, method: $('previewMethod').innerHTML,
                alert: $('warningMessage').textContent, isNutrient: drug.isNutrient
            });
            renderList();
        });

        const renderList = () => {
            $('drugsList').innerHTML = currentDrugs.map((d, i) => `
                <div class="bg-gray-50 p-3 rounded-lg flex justify-between items-start border">
                    <div><b>${d.name}</b> ${d.dose}${d.unit} x${d.freq}<br><small>${d.method}</small></div>
                    <button onclick="currentDrugs.splice(${i},1);renderList()" class="text-red-500">×</button>
                </div>`).join('');
        };

        $('btnSavePatient').addEventListener('click', () => {
            const name = $('inputName').value, w = cleanNum($('inputWeight').value);
            if (!name || w <= 0 || currentDrugs.length === 0) return alert('Data Missing');
            patients.push({ id: Date.now(), name, weight: w, ga: $('inputGA').value, age: $('inputAge').value, drugs: [...currentDrugs] });
            currentDrugs = []; $('inputName').value = ''; renderList(); renderQueue();
            localStorage.setItem('nicu_v2', JSON.stringify(patients));
        });

        const renderQueue = () => {
            $('patientQueue').innerHTML = patients.map(p => `
                <div class="bg-white p-4 rounded-xl border shadow-sm">
                    <div class="flex justify-between border-b pb-2 mb-2">
                        <input type="checkbox" onchange="toggleS(${p.id})">
                        <b>${p.name} (${p.weight}kg)</b>
                        <button onclick="delP(${p.id})" class="text-red-400">Del</button>
                    </div>
                    ${p.drugs.map(d => `<div class="text-xs border-b border-dotted py-1">${d.name}: ${d.method}</div>`).join('')}
                </div>`).join('');
            $('btnPdf').disabled = patients.length === 0;
            $('emptyState').classList.toggle('hidden', patients.length > 0);
        };

        window.delP = id => { patients = patients.filter(p => p.id !== id); renderQueue(); };
        window.toggleS = id => { selectedPatientIds.has(id) ? selectedPatientIds.delete(id) : selectedPatientIds.add(id); };

        $('btnPdf').addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const container = $('pdf-render-container');
            
            for (let p of patients.filter(px => selectedPatientIds.has(px.id))) {
                const div = document.createElement('div');
                div.className = 'pdf-page';
                div.innerHTML = `
                    <div class="pdf-cell" style="width:100mm">
                        <div class="pdf-cell-header"><b>${p.name}</b> | ${p.weight}kg | GA:${p.ga}</div>
                        ${p.drugs.map(d => `
                            <div class="pdf-drug-item">
                                <b>${d.name}</b>: ${d.dose}${d.unit} x${d.freq}<br>
                                <span style="font-size:9pt">${d.method}</span>
                            </div>`).join('')}
                    </div>`;
                container.appendChild(div);
                const canvas = await html2canvas(div, { scale: 2 });
                doc.addImage(canvas.toDataURL('image/jpeg'), 'JPEG', 10, 10, 190, 0);
                doc.addPage();
                container.removeChild(div);
            }
            doc.save('NICU_Report.pdf');
        });

        (function init() {
            let ageOpts = '<option value="">Day</option>';
            for(let i=1; i<=30; i++) ageOpts += `<option value="${i}">${i}</option>`;
            $('inputAge').innerHTML = ageOpts;
            let catOpts = '<option value="">Category</option>';
            DRUG_CATEGORIES.forEach(c => catOpts += `<option value="${c.name}">${c.name}</option>`);
            $('selectCategory').innerHTML = catOpts;
            const saved = localStorage.getItem('nicu_v2');
            if (saved) { patients = JSON.parse(saved); renderQueue(); }
        })();

        $('inputDose').addEventListener('input', updatePreview);
        $('inputFreq').addEventListener('change', updatePreview);
    </script>
</body>
</html>
