<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Dose Calculator | Baghdad Teaching Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0F4F3; --fg: #1C2526; --muted: #5A6872;
            --accent: #0F766E; --accent-light: #14B8A6;
            --card: #FFFFFF; --border: #D1DEDD; --danger: #B91C1C; --surface: #E8EFEE;
        }
        * { 
            font-family: 'Inter', 'Cairo', 'Noto Sans Arabic', sans-serif; 
            text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .display-font { font-family: 'Crimson Pro', serif; }
        body {
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 0% 0%, rgba(15, 118, 110, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(20, 184, 166, 0.04) 0%, transparent 50%);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .animate-fade-up { animation: fadeUp 0.5s ease-out forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .input-field { transition: all 0.2s ease; background: var(--surface); }
        .input-field:focus { background: var(--card); border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12); }
        .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%); transition: all 0.25s ease; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25); }
        .arabic-text { font-family: 'Cairo', sans-serif; direction: rtl; text-align: right; }
        #pdf-render-container { position: absolute; top: 0; left: 0; z-index: -1000; opacity: 0; pointer-events: none; background: white; }
        .pdf-page { width: 210mm; height: 297mm; padding: 8mm; background: white; box-sizing: border-box; page-break-after: always; }
        .pdf-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 3mm; height: 100%; }
        .pdf-cell { border: 2px solid #000; border-radius: 2mm; padding: 3mm; display: flex; flex-direction: column; overflow: hidden; }
        .pdf-cell-header { border-bottom: 2px solid #000; margin: -3mm -3mm 2mm -3mm; padding: 2mm 3mm; }
        .pdf-drug-item { margin-bottom: 1.5mm; padding-bottom: 1.5mm; border-bottom: 1px dashed #999; }
        .pdf-drug-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="min-h-screen">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-[var(--border)] shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-[var(--accent)] to-[var(--accent-light)] flex items-center justify-center shadow-md">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-[var(--fg)]">NICU Dose Calculator</h1>
                    <p class="text-xs text-[var(--muted)]">Baghdad Teaching Hospital</p>
                </div>
            </div>
            <div id="patientCounter" class="hidden px-4 py-2 rounded-full bg-[var(--accent)]/10 border border-[var(--accent)]/20">
                <span id="counterText" class="text-[var(--accent)] font-semibold text-sm">0 Patients</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
        <section class="bg-white rounded-2xl shadow-lg border border-[var(--border)] overflow-hidden animate-fade-up">
            <div class="bg-gradient-to-r from-[var(--accent)] to-[var(--accent-light)] px-6 py-4">
                <h2 class="text-xl text-white font-semibold">Patient Information</h2>
            </div>
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="space-y-1"><label class="text-sm font-semibold">Patient Name</label><input type="text" id="inputName" class="input-field w-full px-4 py-3 rounded-xl border" placeholder="Full name"></div>
                    <div class="space-y-1"><label class="text-sm font-semibold">Weight (kg)</label><input type="text" id="inputWeight" inputmode="decimal" class="input-field w-full px-4 py-3 rounded-xl border" placeholder="e.g. 2.35"></div>
                    <div class="space-y-1"><label class="text-sm font-semibold">Postnatal Age</label><select id="inputAge" class="input-field w-full px-4 py-3 rounded-xl border"></select></div>
                    <div class="space-y-1"><label class="text-sm font-semibold">GA (weeks)</label><input type="text" id="inputGA" inputmode="decimal" class="input-field w-full px-4 py-3 rounded-xl border" placeholder="e.g. 34"></div>
                </div>

                <div class="border-t pt-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4 mb-4 items-start">
                        <div class="lg:col-span-1"><label class="text-sm font-semibold">Category</label><select id="selectCategory" class="input-field w-full px-4 py-3 rounded-xl border"></select></div>
                        <div class="lg:col-span-1"><label class="text-sm font-semibold">Drug</label><select id="selectDrug" class="input-field w-full px-4 py-3 rounded-xl border"></select>
                            <input type="text" id="inputCustomDrug" class="hidden input-field w-full px-4 py-2 rounded-xl border mt-2" placeholder="Drug Name">
                            <input type="text" id="inputCustomMethod" class="hidden input-field w-full px-4 py-2 rounded-xl border mt-2" placeholder="Method">
                        </div>
                        <div class="lg:col-span-2 flex gap-2" id="doseWrapper">
                            <div id="dosePerKgContainer" class="hidden flex-1"><label class="text-sm font-semibold text-[var(--accent)]">Dose/kg</label><input type="text" id="inputDosePerKg" class="input-field w-full px-4 py-3 rounded-xl border font-bold"></div>
                            <div id="totalDoseContainer" class="flex-1"><label class="text-sm font-semibold">Total Dose</label><div class="flex gap-1"><input type="text" id="inputDose" class="input-field flex-1 px-4 py-3 rounded-xl border"><input type="text" id="inputCustomUnit" class="hidden w-16 px-2 py-3 rounded-xl border"></div></div>
                        </div>
                        <div class="lg:col-span-1" id="freqContainer"><label class="text-sm font-semibold">Frequency</label>
                            <select id="inputFreq" class="input-field w-full px-4 py-3 rounded-xl border">
                                <option value="1">Once (x1)</option><option value="2">Twice (x2)</option><option value="3">3 times (x3)</option><option value="4">4 times (x4)</option><option value="q36hr">q36hr</option><option value="q48hr">q48hr</option>
                            </select>
                        </div>
                        <div class="lg:col-span-1 hidden" id="targetVolContainer"><label class="text-sm font-semibold text-[var(--accent)]">Target Vol</label><select id="inputTargetVol" class="input-field w-full px-4 py-3 rounded-xl border"><option value="10">10ml (x2)</option><option value="5">5ml (x3)</option></select></div>
                        <div class="lg:col-span-1 flex items-end"><button id="btnAddDrug" class="btn-primary w-full h-[50px] rounded-xl text-white font-semibold">Add</button></div>
                    </div>

                    <div id="addonContainer" class="hidden grid grid-cols-2 gap-2 mb-4">
                        <div class="space-y-1"><label class="text-sm font-semibold">Add-on (ml)</label><input type="text" id="inputAddonVol" class="input-field w-full px-4 py-3 rounded-xl border"></div>
                        <div class="space-y-1"><label class="text-sm font-semibold">Type</label><input type="text" id="inputAddonType" class="input-field w-full px-4 py-3 rounded-xl border" placeholder="KCL/HT"></div>
                    </div>

                    <div id="methodPreviewContainer" class="hidden bg-[var(--surface)] border border-[var(--accent)]/20 rounded-xl p-4 mb-4">
                        <div class="flex gap-3">
                            <div class="p-2 bg-[var(--accent)]/10 rounded-lg"><svg class="w-5 h-5 text-[var(--accent)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div>
                            <div class="flex-1"><p class="text-xs font-bold text-[var(--accent)] uppercase">Method</p><p id="previewMethod" class="text-sm font-bold">-</p><p id="warningMessage" class="hidden text-sm text-[var(--danger)] font-bold mt-2 arabic-text"></p></div>
                        </div>
                    </div>
                </div>

                <div id="dopamineTableContainer" class="hidden mt-6 overflow-x-auto">
                    <h4 class="font-bold text-[var(--accent)] mb-2">Dopamine Infusion</h4>
                    <table class="w-full text-sm border-collapse border border-[var(--border)] rounded-xl overflow-hidden">
                        <thead class="bg-[var(--accent)] text-white"><tr><th class="p-2 border">Rate (ml/24h)</th><th class="p-2 border">Dose (mcg/kg/min)</th></tr></thead>
                        <tbody id="dopamineTableBody" class="bg-white"></tbody>
                    </table>
                </div>
                <div id="drugsList" class="mt-4 space-y-2"></div>
                <button id="btnSavePatient" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-lg">Save Patient</button>
            </div>
        </section>

        <section class="space-y-4">
            <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">Patient Queue</h2><label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="selectAllCheckbox" class="w-5 h-5 rounded text-[var(--accent)]"><span class="text-sm font-medium">Select All</span></label></div>
            <div class="flex gap-2"><button id="btnPdf" disabled class="btn-primary px-5 py-2 rounded-xl text-white font-medium">Generate PDF</button><button id="btnClearAll" class="px-5 py-2 rounded-xl border border-[var(--danger)]/30 text-[var(--danger)]">Clear All</button></div>
            <div id="patientQueue" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            <div id="emptyState" class="text-center py-10 bg-white rounded-2xl border-2 border-dashed"><p class="text-[var(--muted)]">No patients in queue</p></div>
        </section>
    </main>

    <div id="pdf-render-container"></div>
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 opacity-0 transition-all duration-300"><span id="toastMsg"></span></div>

    <script>
        const $ = id => document.getElementById(id);
        const METHODS = { 
            1: '** / 5min', 2: '** + 5 ml GW / 10 min', 3: '** + ## ml GW >> ^^ ml /30 min',
            4: '** + 3 ml GW / 3 min', 5: '** / 60 min', 6: 'over 24 hr', 7: 'Special Nutrients',
            8: '** مع المغذي', 9: 'كل اثنين وخميس', 10: '** + ## ml GW >> ^^ ml /24 hr',
            11: '** + 3ml NS / 15 min تبخير', 12: 'تحل الكبسولة ب ٢ سي سي...'
        };

        // دالة مساعدة لإنشاء قواعد التحذير المكررة
        const freqRule = (gaLimit, pnaLimit, f1, f2) => (ga, pna) => (ga < gaLimit) ? (pna < pnaLimit ? f1 : f2) : f2;

        const DRUG_CONFIG = [
            { id: 1, name: 'Amoxicillin', dosePerKg: 50, factor: 50, methodIndex: 1, rule: freqRule(100, 8, '2', '3') },
            { id: 16, name: 'Amikacin', dosePerKg: 15, factor: 8, methodIndex: 2, defaultFreq: '1' },
            { id: 2, name: 'Gentamicin', dosePerKg: 5, factor: 40, methodIndex: 2, rule: (ga, pna) => ga <= 29 ? (pna <= 14 ? 'q48hr' : 'q36hr') : (ga <= 34 ? 'q36hr' : '1') },
            { id: 3, name: 'Caffeine Load', dosePerKg: 20, factor: 20, methodIndex: 3, defaultFreq: '1' },
            { id: 4, name: 'Caffeine Maint', dosePerKg: 10, factor: 20, methodIndex: 2, defaultFreq: '1' },
            { id: 8, name: 'Meropenem', dosePerKg: 40, factor: 50, methodIndex: 3, rule: freqRule(32, 14, '2', '3') },
            { id: 9, name: 'Dopamine pump', isDopamine: true, defaultFreq: '1' },
            { id: 22, name: 'Dopamine + fluid', dosePerKg: 5, factor: 40, methodIndex: 8, isDopamine: true, calc24h: true },
            { id: 23, name: 'Dopamine Y-site', dosePerKg: 5, factor: 40, methodIndex: 10, isDopamine: true, calc24h: true },
            { id: 11, name: 'Vancomycin', dosePerKg: 15, factor: 2, methodIndex: 5, isVancomycin: true },
            { id: 17, name: 'Dexmed. + fluid', dosePerKg: 0.3, factor: 100, methodIndex: 8, calc24h: true },
            { id: 18, name: 'Dexmed. Y-site', dosePerKg: 0.3, factor: 100, methodIndex: 10, calc24h: true },
            { id: 19, name: 'Midazolam + fluid', dosePerKg: 0.03, factor: 5, methodIndex: 8, calc24h: true },
            { id: 20, name: 'Midazolam Y-site', dosePerKg: 0.03, factor: 5, methodIndex: 10, calc24h: true },
            { id: 12, name: 'TPN', methodIndex: 6, hideDetails: true },
            { id: 13, name: '1/5 GS', methodIndex: 7, isNutrient: true },
            { id: 14, name: '10% GW', methodIndex: 7, isNutrient: true },
            { id: 15, name: '5% GW', methodIndex: 7, isNutrient: true, noPrep: true }
        ];

        const DRUG_CATEGORIES = [
            { name: 'Antibiotics', ids: [1, 2, 8, 11, 16] },
            { name: 'Sedation', ids: [9, 17, 18, 19, 20, 22, 23] },
            { name: 'Fluids', ids: [12, 13, 14, 15] },
            { name: 'Other+', ids: ['other'] }
        ];

        let patients = [], currentDrugs = [], selectedPatientIds = new Set();

        // تنظيف وتحويل المدخلات الرقمية
        const cleanInputNumber = val => {
            if (!val) return 0;
            let s = val.toString().replace(/[،,٫]/g, '.');
            ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'].forEach((n, i) => s = s.replace(new RegExp(n, 'g'), i));
            return parseFloat(s.replace(/[^0-9.]/g, '')) || 0;
        };

        // مراقب عام لكل حقول الإدخال لتصحيح الفواصل تلقائياً
        document.body.addEventListener('input', e => {
            if (e.target.inputMode === 'decimal') {
                e.target.value = e.target.value.replace(/[،,٫]/g, '.');
            }
        });

        const showToast = (msg, type = 'success') => {
            const toast = $('toast');
            toast.textContent = msg;
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-medium shadow-xl z-50 transition-all duration-300 ${type === 'success' ? 'bg-[#047857] text-white' : 'bg-red-700 text-white'}`;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        };

        const handleDrugSelectionChange = () => {
            const drug = DRUG_CONFIG.find(d => d.id == $('selectDrug').value);
            const weight = cleanInputNumber($('inputWeight').value);
            const ga = cleanInputNumber($('inputGA').value);
            const pna = parseInt($('inputAge').value) || 0;

            // إعادة ضبط الواجهة
            $('totalDoseContainer').classList.remove('hidden');
            $('freqContainer').classList.remove('hidden');
            $('dosePerKgContainer').classList.add('hidden');
            $('addonContainer').classList.add('hidden');
            $('targetVolContainer').classList.add('hidden');
            $('dopamineTableContainer').classList.add('hidden');

            if (!drug) return;

            // منطق حساب الجرعة
            if (drug.calc24h) {
                $('dosePerKgContainer').classList.remove('hidden');
                $('inputDosePerKg').value = drug.dosePerKg;
                if (weight > 0) {
                    const total = drug.isDopamine ? (weight * drug.dosePerKg * 1440) / 1000 : (weight * drug.dosePerKg * 24);
                    $('inputDose').value = total.toFixed(2);
                }
            } else if (drug.isDopamine && drug.id === 9) {
                $('dopamineTableContainer').classList.remove('hidden');
                renderDopamineTable(weight);
            } else if (weight > 0 && drug.dosePerKg) {
                $('inputDose').value = (weight * drug.dosePerKg).toFixed(1);
            }

            // منطق التردد
            if (drug.rule) $('inputFreq').value = drug.rule(ga, pna);
            else if (drug.defaultFreq) $('inputFreq').value = drug.defaultFreq;

            if (drug.methodIndex === 3 || drug.methodIndex === 10) $('targetVolContainer').classList.remove('hidden');
            if (drug.isNutrient && !drug.noPrep) $('addonContainer').classList.remove('hidden');

            updateMethodPreview(drug, cleanInputNumber($('inputDose').value));
        };

        const handleManualDoseChange = (source) => {
            const drug = DRUG_CONFIG.find(d => d.id == $('selectDrug').value);
            const weight = cleanInputNumber($('inputWeight').value);
            if (!drug || weight <= 0) return;

            if (drug.calc24h) {
                if (source === 'kg') {
                    const val = cleanInputNumber($('inputDosePerKg').value);
                    const total = drug.isDopamine ? (weight * val * 1440) / 1000 : (weight * val * 24);
                    $('inputDose').value = total.toFixed(2);
                } else {
                    const total = cleanInputNumber($('inputDose').value);
                    const perKg = drug.isDopamine ? (total * 1000) / (weight * 1440) : total / (weight * 24);
                    $('inputDosePerKg').value = perKg.toFixed(3);
                }
            }
            updateMethodPreview(drug, cleanInputNumber($('inputDose').value));
        };

        const generateMethodString = (drug, finalDose) => {
            if (drug.isDopamine && drug.id === 9) return '1 ml dopamin + 39 ml GW';
            if (drug.isNutrient) {
                if (drug.noPrep) return " ";
                const addon = cleanInputNumber($('inputAddonVol').value);
                const type = $('inputAddonType').value || 'Add-on';
                let base = (drug.name === '1/5 GS') ? `(5% GW ${(finalDose*0.8).toFixed(0)} + NS ${(finalDose*0.2).toFixed(0)})` : `(5% GW ${(finalDose*0.9).toFixed(0)} + HT ${(finalDose*0.1).toFixed(0)})`;
                return base + (addon > 0 ? ` + ${addon}ml ${type}` : "");
            }
            if (!METHODS[drug.methodIndex]) return '-';
            
            let vol = finalDose / (drug.factor || 1);
            let target = parseInt($('inputTargetVol').value) || 10;
            if (drug.methodIndex === 3 || drug.methodIndex === 10) vol *= (target === 10 ? 2 : 3);
            
            let s = METHODS[drug.methodIndex].replace('**', (vol < 1 ? (vol*100).toFixed(0)+' unit' : vol.toFixed(1)+' ml'));
            return s.replace('##', (20 - (vol)).toFixed(0)).replace('^^', target);
        };

        const updateMethodPreview = (drug, dose) => {
            $('previewMethod').innerHTML = generateMethodString(drug, dose);
            $('methodPreviewContainer').classList.toggle('hidden', !drug);
        };

        const renderDopamineTable = w => {
            $('dopamineTableBody').innerHTML = [2, 5, 7, 10].map(d => `<tr><td class="p-2 border font-bold">${((d*w*1440)/1000).toFixed(0)} ml</td><td class="p-2 border">${d}</td></tr>`).join('');
        };

        const addDrug = () => {
            const drug = DRUG_CONFIG.find(d => d.id == $('selectDrug').value);
            if (!drug || !cleanInputNumber($('inputWeight').value)) return showToast("Check weight/drug", "error");
            
            const dose = cleanInputNumber($('inputDose').value);
            currentDrugs.push({
                name: drug.name,
                dose: drug.id === 9 ? 'Infusion' : dose,
                unit: drug.unit || 'mg',
                freq: $('inputFreq').value,
                method: generateMethodString(drug, dose)
            });
            renderDrugsList();
            showToast("Added");
        };

        const renderDrugsList = () => {
            $('drugsList').innerHTML = currentDrugs.map((d, i) => `
                <div class="bg-[var(--surface)] p-4 rounded-xl flex justify-between items-center">
                    <div><p class="font-bold">${d.name} <span class="text-xs text-[var(--muted)]">${d.dose} ${d.unit}</span></p><p class="text-xs">${d.method}</p></div>
                    <button onclick="currentDrugs.splice(${i},1);renderDrugsList()" class="text-red-600">×</button>
                </div>`).join('');
        };

        const savePatient = () => {
            if (!$('inputName').value || currentDrugs.length === 0) return showToast("Missing Info", "error");
            patients.push({ id: Date.now().toString(36), name: $('inputName').value, weight: $('inputWeight').value, age: $('inputAge').value, ga: $('inputGA').value, drugs: [...currentDrugs] });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
            currentDrugs = []; renderDrugsList(); $('inputName').value = '';
            renderQueue(); showToast("Saved");
        };

        const renderQueue = () => {
            const empty = patients.length === 0;
            $('emptyState').classList.toggle('hidden', !empty);
            $('btnPdf').disabled = empty;
            $('patientQueue').innerHTML = patients.map(p => `
                <div class="bg-white p-4 rounded-2xl border border-[var(--border)]">
                    <div class="flex justify-between border-b pb-2 mb-2"><h3 class="font-bold">${p.name}</h3><button onclick="deletePatient('${p.id}')" class="text-red-500">Delete</button></div>
                    <p class="text-xs text-[var(--muted)]">${p.weight}kg | Day ${p.age}</p>
                    <div class="mt-2 space-y-1">${p.drugs.map(d => `<div class="text-[10px] border-l-2 border-[var(--accent)] pl-2">${d.name}</div>`).join('')}</div>
                </div>`).join('');
            $('counterText').textContent = `${patients.length} Patients`;
            $('patientCounter').classList.toggle('hidden', empty);
        };

        const deletePatient = id => { patients = patients.filter(p => p.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(patients)); renderQueue(); };

        const populate = () => {
            $('inputAge').innerHTML = Array.from({length:30}, (_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join('') + `<option value="31">>30 Days</option>`;
            $('selectCategory').innerHTML = '<option value="">Category</option>' + DRUG_CATEGORIES.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        };

        // ربط الأحداث
        $('selectCategory').onchange = () => {
            const cat = DRUG_CATEGORIES.find(c => c.name === $('selectCategory').value);
            $('selectDrug').innerHTML = '<option value="">Drug</option>' + (cat ? cat.ids.map(id => {
                const d = DRUG_CONFIG.find(x => x.id == id);
                return `<option value="${id}">${d?d.name:'Other'}</option>`;
            }).join('') : '');
        };
        $('selectDrug').onchange = handleDrugSelectionChange;
        $('inputWeight').oninput = handleDrugSelectionChange;
        $('inputDosePerKg').oninput = () => handleManualDoseChange('kg');
        $('inputDose').oninput = () => handleManualDoseChange('total');
        $('btnAddDrug').onclick = addDrug;
        $('btnSavePatient').onclick = savePatient;
        $('btnClearAll').onclick = () => { if(confirm('Clear all?')) { patients=[]; localStorage.clear(); renderQueue(); }};

        window.onload = () => { populate(); const d = localStorage.getItem(STORAGE_KEY); if(d){ patients=JSON.parse(d); renderQueue(); }};
    </script>
</body>
</html>
