<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Pro | Baghdad Teaching Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #0F766E; --bg: #F8FAFC; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); }
        .input-field { @apply w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-[var(--accent)] outline-none transition-all; }
        .btn { @apply px-5 py-2.5 rounded-xl font-semibold transition-all active:scale-95 disabled:opacity-50; }
        .card { @apply bg-white rounded-2xl shadow-sm border border-gray-100 p-5; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">NICU Dose Calculator</h1>
            <p class="text-sm text-gray-500">Baghdad Teaching Hospital</p>
        </div>
        <div id="counter" class="hidden bg-teal-50 text-teal-700 px-4 py-2 rounded-full border border-teal-100 font-bold"></div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        <section class="lg:col-span-1 space-y-6">
            <div class="card space-y-4">
                <h2 class="text-lg font-bold border-b pb-2">Patient Info</h2>
                <input type="text" id="name" placeholder="Patient Name" class="input-field">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="weight" step="0.1" placeholder="Wt (kg)" class="input-field">
                    <input type="number" id="ga" placeholder="GA (wks)" class="input-field">
                </div>
                <select id="age" class="input-field"></select>
            </div>

            <div class="card space-y-4">
                <h2 class="text-lg font-bold border-b pb-2">Medications</h2>
                <select id="drugSelect" class="input-field"></select>
                <input type="text" id="customDrug" placeholder="Drug Name" class="input-field hidden">
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="dose" placeholder="Dose (mg)" class="input-field">
                    <select id="freq" class="input-field">
                        <option value="1">QD (1x)</option>
                        <option value="2">BID (2x)</option>
                        <option value="3">TID (3x)</option>
                    </select>
                </div>
                <button id="addDrug" class="btn bg-gray-100 text-gray-700 w-full hover:bg-gray-200">+ Add Medication</button>
                <div id="currentDrugs" class="space-y-2"></div>
            </div>
            
            <button id="submitPatient" class="btn bg-teal-700 text-white w-full py-4 shadow-lg shadow-teal-700/20 hover:bg-teal-800">Add to Queue</button>
        </section>

        <section class="lg:col-span-2 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">Live Queue</h2>
                <div class="flex gap-2">
                    <button id="btnPdf" class="btn bg-white border border-gray-200 text-gray-700 hover:bg-gray-50">PDF</button>
                    <button id="btnTg" class="btn bg-[#229ED9] text-white hover:bg-[#1a8bc4]">Telegram</button>
                    <button id="clearAll" class="btn text-red-600 hover:bg-red-50">Clear</button>
                </div>
            </div>
            <div id="queue" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div id="empty" class="text-center py-20 bg-gray-50 rounded-3xl border-2 border-dashed border-gray-200 text-gray-400">Queue is empty</div>
        </section>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm space-y-4">
            <h3 id="modalTitle" class="font-bold text-lg">Confirm Action</h3>
            <div id="modalBody" class="space-y-3"></div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeModal()" class="btn flex-1 bg-gray-100">Cancel</button>
                <button id="modalConfirm" class="btn flex-1 bg-teal-700 text-white">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Config & State (استخدام الكائنات لتقليل التكرار)
        const DRUGS = {
            meropenem: { name: 'Meropenem', d: 40, f: 3, m: 'Dilute in 10ml NS, 30m infusion' },
            amoxicillin: { name: 'Amoxicillin', d: 50, f: 2, m: 'Dilute in 5ml NS, 20m infusion' },
            gentamicin: { name: 'Gentamicin', d: 5, f: 1, m: 'IV push 3-5m' },
            other: { name: 'Custom', d: 0, f: 1, m: 'As prescribed' }
        };

        const TG = { token: '8626818806:AAFkeAd1LrRo2pdUnGl6V8vV3TiAEgk415s', chat: '-1002141194993' };
        let state = { patients: JSON.parse(localStorage.getItem('nicu_data') || '[]'), currentDrugs: [] };

        // 2. Helpers
        const el = id => document.getElementById(id);
        const save = () => { localStorage.setItem('nicu_data', JSON.stringify(state.patients)); render(); };
        
        function closeModal() { el('modal').classList.replace('flex', 'hidden'); }
        function openModal(title, content, onConfirm) {
            el('modalTitle').innerText = title; el('modalBody').innerHTML = content;
            el('modalConfirm').onclick = () => { onConfirm(); closeModal(); };
            el('modal').classList.replace('hidden', 'flex');
        }

        // 3. Logic
        function render() {
            const isEmpty = state.patients.length === 0;
            el('empty').classList.toggle('hidden', !isEmpty);
            el('counter').innerText = `${state.patients.length} Patients`;
            el('counter').classList.toggle('hidden', isEmpty);
            
            el('queue').innerHTML = state.patients.map(p => `
                <div class="card hover:border-teal-200 transition-colors">
                    <div class="flex justify-between items-start mb-3">
                        <div><p class="font-bold text-lg">${p.name}</p><p class="text-xs text-gray-500">${p.weight}kg | Day ${p.age}</p></div>
                        <button onclick="deleteP('${p.id}')" class="text-red-400 hover:text-red-600">✕</button>
                    </div>
                    <div class="space-y-1">${p.drugs.map(d => `<p class="text-sm bg-gray-50 p-1.5 rounded"><b>${d.name}</b>: ${d.dose}mg (${d.freq}x)</p>`).join('')}</div>
                </div>
            `).join('');
        }

        function deleteP(id) { state.patients = state.patients.filter(p => p.id !== id); save(); }

        // 4. Events
        window.onload = () => {
            // Populate Dropdowns
            el('age').innerHTML = Array.from({length:30}, (_,i)=>`<option value="${i+1}">Day ${i+1}</option>`).join('');
            el('drugSelect').innerHTML = Object.entries(DRUGS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');
            render();
        };

        el('drugSelect').onchange = (e) => {
            const d = DRUGS[e.target.value];
            el('customDrug').classList.toggle('hidden', e.target.value !== 'other');
            if(e.target.value !== 'other') {
                el('dose').value = (el('weight').value * d.d).toFixed(1);
                el('freq').value = d.f;
            }
        };

        el('addDrug').onclick = () => {
            const dKey = el('drugSelect').value;
            const name = dKey === 'other' ? el('customDrug').value : DRUGS[dKey].name;
            if(!name || !el('dose').value) return alert('Fill drug info');
            state.currentDrugs.push({ name, dose: el('dose').value, freq: el('freq').value, m: DRUGS[dKey].m });
            el('currentDrugs').innerHTML = state.currentDrugs.map(d => `<div class="text-xs bg-teal-50 text-teal-800 p-2 rounded">${d.name} ${d.dose}mg</div>`).join('');
        };

        el('submitPatient').onclick = () => {
            if(!el('name').value || state.currentDrugs.length === 0) return alert('Missing info');
            state.patients.push({ id: Date.now().toString(), name: el('name').value, weight: el('weight').value, age: el('age').value, ga: el('ga').value, drugs: [...state.currentDrugs] });
            state.currentDrugs = []; el('currentDrugs').innerHTML = ''; el('name').value = ''; save();
        };

        el('btnTg').onclick = () => {
            let msg = `🏥 *NICU REPORT*\n`;
            state.patients.forEach(p => {
                msg += `\n*${p.name}* (${p.weight}kg)\n` + p.drugs.map(d => `• ${d.name}: ${d.dose}mg (${d.freq}x)`).join('\n');
            });
            fetch(`https://api.telegram.org/bot${TG.token}/sendMessage`, {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ chat_id: TG.chat, text: msg, parse_mode: 'Markdown' })
            }).then(() => alert('Sent to Telegram!'));
        };

        el('btnPdf').onclick = () => {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4');
            doc.setFontSize(10); doc.text("NICU DOSE REPORT - BAGHDAD TEACHING HOSPITAL", 10, 10);
            state.patients.forEach((p, i) => {
                let y = 20 + (i * 30);
                doc.text(`${i+1}. ${p.name} | ${p.weight}kg | Day ${p.age}`, 10, y);
                doc.text(p.drugs.map(d => `${d.name} (${d.dose}mg)`).join(' , '), 15, y + 5);
            });
            doc.save('NICU_Report.pdf');
        };

        el('clearAll').onclick = () => openModal("Clear Queue?", "This will delete all patient data.", () => { state.patients = []; save(); });
    </script>
</body>
</html>
