<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICU Calculator | Baghdad Teaching Hospital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f766e;
            --primary-light: #14b8a6;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background-color: var(--bg-main);
            color: #1e293b;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .input-group focus-within:ring-2 {
            ring-color: var(--primary-light);
        }

        .btn-grad {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            transition: all 0.3s ease;
        }

        .btn-grad:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
        }

        .patient-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* تنسيقات خاصة للـ PDF لضمان الجودة */
        #pdf-render-container {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 210mm;
        }
        
        .pdf-page {
            width: 210mm;
            height: 297mm;
            padding: 10mm;
            background: white;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 5mm;
        }

        .pdf-card {
            border: 2px solid #000;
            padding: 4mm;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="glass-header sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-teal-700 text-white p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">حاسبة جرع الخدج</h1>
                    <p class="text-xs text-slate-500 font-semibold">مستشفى بغداد التعليمي - NICU</p>
                </div>
            </div>
            <div id="badge-container" class="hidden">
                <span class="bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-sm font-bold" id="patient-count">0 مرضى</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-8 space-y-6">
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200">
                    <h2 class="font-bold text-slate-700 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        بيانات المريض
                    </h2>
                </div>
                
                <div class="p-6 grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-600 mb-1">اسم المريض</label>
                        <input type="text" id="p-name" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="الاسم الكامل">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">الوزن (kg)</label>
                        <input type="number" step="0.01" id="p-weight" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">العمر (بالأيام)</label>
                        <input type="number" id="p-age" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="1">
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="font-bold text-slate-700 mb-4 flex items-center gap-2 text-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-teal-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    إضافة علاج
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">التصنيف</label>
                        <select id="cat-select" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">الدواء</label>
                        <select id="drug-select" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">التكرار</label>
                        <select id="freq-select" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white outline-none">
                            <option value="x1">مرة واحدة (x1)</option>
                            <option value="x2">مرتين (x2)</option>
                            <option value="x3">3 مرات (x3)</option>
                            <option value="x4">4 مرات (x4)</option>
                            <option value="q36hr">كل 36 ساعة</option>
                            <option value="q48hr">كل 48 ساعة</option>
                        </select>
                    </div>
                </div>

                <div id="dose-preview" class="bg-teal-50 rounded-xl p-4 border border-teal-100 mb-4 hidden">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span class="text-teal-800 font-bold" id="calculated-dose-text">الجرعة: --</span>
                            <p class="text-xs text-teal-600 mt-1 font-semibold" id="prep-method-text">طريقة التحضير ستظهر هنا</p>
                        </div>
                        <button id="btn-add-drug" class="btn-grad text-white px-6 py-2 rounded-lg font-bold w-full md:w-auto">
                            + إضافة للجدول
                        </button>
                    </div>
                </div>

                <div id="current-drugs-list" class="space-y-2"></div>
            </section>

            <button id="btn-save-patient" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-900 transition-colors shadow-lg">
                حفظ المريض في قائمة الانتظار
            </button>
        </div>

        <div class="lg:col-span-4">
            <div class="sticky top-24 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-800 text-lg tracking-tight">قائمة المرضى</h2>
                    <button id="btn-generate-pdf" class="bg-red-600 text-white px-3 py-1 rounded-md text-sm font-bold hover:bg-red-700 transition-colors flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        طباعة PDF
                    </button>
                </div>
                
                <div id="patient-queue" class="space-y-3">
                    <div id="empty-state" class="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center">
                        <p class="text-slate-400 font-medium">لا يوجد مرضى حالياً</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="pdf-render-container"></div>

    <script>
        // --- قاعدة بيانات الأدوية ---
        const DRUGS = [
            { id: 1, cat: 'Antibiotics', name: 'Amoxicillin', doseKg: 50, factor: 50, unit: 'mg', method: 'IV over 5 min' },
            { id: 2, cat: 'Antibiotics', name: 'Gentamicin', doseKg: 5, factor: 40, unit: 'mg', method: 'IV + 5ml GW over 10 min' },
            { id: 3, cat: 'Antibiotics', name: 'Amikacin', doseKg: 15, factor: 50, unit: 'mg', method: 'IV + 5ml GW over 10 min' },
            { id: 4, cat: 'Antibiotics', name: 'Colistin (Loading)', doseKg: 150000, factor: 500000, unit: 'IU', method: 'IV + 5ml GW over 10 min' },
            { id: 5, cat: 'Antibiotics', name: 'Colistin (Maint.)', doseKg: 37500, factor: 500000, unit: 'IU', method: 'IV + 5ml GW over 10 min' },
            { id: 6, cat: 'Antibiotics', name: 'Meropenem', doseKg: 40, factor: 50, unit: 'mg', method: 'IV over 30 min' },
            { id: 7, cat: 'Sedatives', name: 'Caffeine (Loading)', doseKg: 20, factor: 20, unit: 'mg', method: 'IV/Oral once' },
            { id: 8, cat: 'Sedatives', name: 'Caffeine (Maint.)', doseKg: 10, factor: 20, unit: 'mg', method: 'IV/Oral once daily' },
            { id: 9, cat: 'Inotropes', name: 'Dopamine', isDopamine: true, unit: 'mcg/kg/min' }
        ];

        const CATEGORIES = ['Antibiotics', 'Sedatives', 'Inotropes', 'Fluids', 'Other'];

        let currentDrugs = [];
        let patientQueue = JSON.parse(localStorage.getItem('nicu_queue') || '[]');

        // --- عناصر الواجهة ---
        const $ = id => document.getElementById(id);
        const catSelect = $('cat-select');
        const drugSelect = $('drug-select');
        const pWeight = $('p-weight');
        const drugListDiv = $('current-drugs-list');

        // --- المبادرة ---
        function init() {
            CATEGORIES.forEach(c => catSelect.options.add(new Option(c, c)));
            updateDrugOptions();
            renderQueue();
        }

        catSelect.onchange = updateDrugOptions;
        drugSelect.onchange = calculateCurrentDose;
        pWeight.oninput = calculateCurrentDose;

        function updateDrugOptions() {
            drugSelect.innerHTML = '';
            const filtered = DRUGS.filter(d => d.cat === catSelect.value);
            filtered.forEach(d => drugSelect.options.add(new Option(d.name, d.id)));
            calculateCurrentDose();
        }

        function calculateCurrentDose() {
            const weight = parseFloat(pWeight.value) || 0;
            const drugId = parseInt(drugSelect.value);
            const drug = DRUGS.find(d => d.id === drugId);
            const preview = $('dose-preview');

            if (!drug || weight <= 0) {
                preview.classList.add('hidden');
                return;
            }

            preview.classList.remove('hidden');
            
            if (drug.isDopamine) {
                $('calculated-dose-text').innerText = `Dopamine Infusion Table (Auto-calculated)`;
                $('prep-method-text').innerText = `انقر للإضافة لعرض جدول السرعات المقترح`;
            } else {
                const totalDose = (drug.doseKg * weight).toFixed(1);
                const drawnVol = (totalDose / drug.factor).toFixed(2);
                $('calculated-dose-text').innerText = `الجرعة: ${totalDose} ${drug.unit} (${drawnVol} ml)`;
                $('prep-method-text').innerText = `طريقة الإعطاء: ${drug.method}`;
            }
        }

        // --- إضافة دواء للقائمة المؤقتة ---
        $('btn-add-drug').onclick = () => {
            const weight = parseFloat(pWeight.value);
            const drugId = parseInt(drugSelect.value);
            const drug = DRUGS.find(d => d.id === drugId);
            const freq = $('freq-select').value;

            const doseData = {
                ...drug,
                calculatedDose: (drug.doseKg * weight).toFixed(1),
                drawnVol: ( (drug.doseKg * weight) / drug.factor ).toFixed(2),
                freq: freq
            };

            currentDrugs.push(doseData);
            renderCurrentDrugs();
        };

        function renderCurrentDrugs() {
            drugListDiv.innerHTML = currentDrugs.map((d, index) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200 animate-fade-in text-sm">
                    <div>
                        <span class="font-bold text-slate-700">${d.name}</span>
                        <span class="text-slate-500 mr-2">${d.calculatedDose} ${d.unit} | ${d.freq}</span>
                    </div>
                    <button onclick="removeDrug(${index})" class="text-red-500 hover:text-red-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        window.removeDrug = (i) => {
            currentDrugs.splice(i, 1);
            renderCurrentDrugs();
        };

        // --- حفظ المريض ---
        $('btn-save-patient').onclick = () => {
            const name = $('p-name').value.trim();
            const weight = parseFloat(pWeight.value);
            
            if (!name || !weight || currentDrugs.length === 0) {
                alert("يرجى ملء كافة البيانات وإضافة دواء واحد على الأقل");
                return;
            }

            const patient = {
                id: Date.now(),
                name,
                weight,
                age: $('p-age').value,
                drugs: [...currentDrugs]
            };

            patientQueue.push(patient);
            localStorage.setItem('nicu_queue', JSON.stringify(patientQueue));
            
            // إعادة ضبط
            $('p-name').value = '';
            $('p-weight').value = '';
            currentDrugs = [];
            renderCurrentDrugs();
            renderQueue();
            alert("تم حفظ المريض في القائمة");
        };

        function renderQueue() {
            const container = $('patient-queue');
            const badge = $('badge-container');
            
            if (patientQueue.length === 0) {
                container.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center"><p class="text-slate-400 font-medium">لا يوجد مرضى</p></div>`;
                badge.classList.add('hidden');
                return;
            }

            badge.classList.remove('hidden');
            $('patient-count').innerText = `${patientQueue.length} مرضى`;

            container.innerHTML = patientQueue.map(p => `
                <div class="patient-card bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-slate-800">${p.name}</h3>
                            <p class="text-xs text-slate-500">${p.weight} kg | العمر: ${p.age} يوم</p>
                        </div>
                        <button onclick="deletePatient(${p.id})" class="text-slate-300 hover:text-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                    <div class="space-y-1">
                        ${p.drugs.map(d => `<p class="text-[10px] bg-slate-50 px-2 py-1 rounded inline-block ml-1">${d.name}</p>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.deletePatient = (id) => {
            patientQueue = patientQueue.filter(p => p.id !== id);
            localStorage.setItem('nicu_queue', JSON.stringify(patientQueue));
            renderQueue();
        };

        // --- نظام طباعة PDF المطور ---
        $('btn-generate-pdf').onclick = async () => {
            if (patientQueue.length === 0) return;
            
            const container = $('pdf-render-container');
            container.innerHTML = '';
            
            // تقسيم المرضى لصفحات (كل صفحة 6 بطاقات)
            for (let i = 0; i < patientQueue.length; i += 6) {
                const page = document.createElement('div');
                page.className = 'pdf-page';
                
                const chunk = patientQueue.slice(i, i + 6);
                chunk.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'pdf-card';
                    card.innerHTML = `
                        <div style="border-bottom: 1px solid #000; padding-bottom: 2mm; margin-bottom: 2mm; display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: 900; font-size: 12pt;">${p.name}</span>
                            <span style="font-size: 10pt;">${p.weight}kg | Day ${p.age}</span>
                        </div>
                        <div style="flex-grow: 1;">
                            ${p.drugs.map(d => `
                                <div style="margin-bottom: 2mm; border-bottom: 0.5px dashed #ccc; padding-bottom: 1mm;">
                                    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 9pt;">
                                        <span>${d.name}</span>
                                        <span>${d.calculatedDose} ${d.unit} (${d.freq})</span>
                                    </div>
                                    <div style="font-size: 8pt; color: #444; direction: ltr; text-align: left;">
                                        ${d.drawnVol} ml -> ${d.method}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div style="font-size: 7pt; text-align: center; color: #888; margin-top: auto;">
                            Baghdad Teaching Hospital - NICU Unit
                        </div>
                    `;
                    page.appendChild(card);
                });
                container.appendChild(page);
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pages = container.querySelectorAll('.pdf-page');

            for (let j = 0; j < pages.length; j++) {
                const canvas = await html2canvas(pages[j], { scale: 2 });
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                if (j > 0) doc.addPage();
                doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
            }

            doc.save(`NICU_Report_${new Date().toLocaleDateString()}.pdf`);
            container.innerHTML = '';
        };

        init();
    </script>
</body>
</html>
